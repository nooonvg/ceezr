<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <!--
      `F1-09`: منعُ طلبِ `favicon.ico` — الخادمُ يُرجِعُ `index.html` لكلِّ مسارٍ
      غيرِ مطابقٍ، فيُهدرُ ~١٠ كيلوبايت. الرابطُ الفارغُ يُوقف الطلبَ.
    -->
    <link rel="icon" href="data:," />
    <title>وَصْلة</title>
    <!--
      Telegram WebApp script is loaded from telegram.org only when running
      inside Telegram. Outside Telegram the tg/ wrapper degrades gracefully
      (ARCH-014 / ADR 0031). No other third-party executable origins.
    -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      `DEC-19` · `F1-09`: الهيكلُ الساكنُ يُرسَمُ قبلَ تنزيلِ حزمِ الشيفرةِ، فيصبحُ
      أوّلُ رسمٍ ذي محتوى (FCP) بعدَ طلبِ المستندِ وحدَه لا بعدَ تنزيلِ الشيفرةِ.
      النصُّ «جارٍ التحميل» مرئيٌّ صراحةً ليحتسبه Chromium كـcontentful.
      ولا يحملُ `elementtiming` — فهو ليسَ نقطةَ قياسِ سطحِ الراكبِ ولا
      عنصرَ LCP. وReact يُبدِّلُه حين يُركَّبُ.
    -->
    <style>
      .sk-preboot {
        display: grid;
        gap: 0.6rem;
        padding: 1rem;
        max-inline-size: 28rem;
        margin-inline: auto;
      }
      .sk-preboot__line {
        block-size: 0.9rem;
        border-radius: 0.45rem;
        background: #e2e8f0;
        animation: sk-preboot-pulse 1.4s ease-in-out infinite;
      }
      .sk-preboot__line--title {
        block-size: 1.5rem;
        max-inline-size: 60%;
      }
      .sk-preboot__line--short {
        max-inline-size: 45%;
      }
      .sk-preboot__text {
        font-size: 0.9rem;
        color: #64748b;
        font-weight: 500;
      }
      @keyframes sk-preboot-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-preboot__line {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk-preboot" aria-hidden="true">
        <span class="sk-preboot__text">جارٍ التحميل</span>
        <span class="sk-preboot__line sk-preboot__line--title"></span>
        <span class="sk-preboot__line"></span>
        <span class="sk-preboot__line"></span>
        <span class="sk-preboot__line sk-preboot__line--short"></span>
      </div>
    </div>
    <!--
      `DEC-19` · `F1-09` · `D-27`: التقديمُ الساكنُ سكربتٌ **كلاسيكيٌّ** لا وحدةٌ، عن قصدٍ:
      Vite يطوي كلَّ سكربتِ وحدةٍ مُضمَّنٍ في وحدةِ المدخلِ، فيقعُ بعدَ `import`
      حزمِ الشيفرةِ ولا يُنفَّذُ إلّا بعدَ تنزيلِها — وهذا ما كانَ (CI `35994981204`: الجلسةُ
      تبدأُ عندَ 2060 ms بعدَ `shell` عندَ 2046). والكلاسيكيُّ يبقى في موضعِه ويُنفَّذُ حينَ
      يُحلَّلُ، أي بعدَ طلبِ المستندِ وحدَه. وحاجزُ المُخرَجِ `preboot-dist.test.ts` يُسقِطُ
      البناءَ إن طُوِيَ أو وقعَ بعدَ المدخلِ. وبصمتُه في `script-src` كبصمةِ المدخلِ.
      `initData` من المضيفِ إن حُقِنَ، وإلّا من `#tgWebAppData` حيثُ يضعُه تيليجرامُ —
      لأنَّ سكربتَ تيليجرامَ `defer` فلم يُنفَّذْ بعدُ. ويحترمُ أصلَ البوّابةِ (`D-28`) كما
      يحترمُه `api/client.ts`. ولا يفعلُ شيئاً خارجَ تيليجرامَ. والاستهلاكُ في `identity/preboot.ts`.
    -->
    <script>
      (function () {
        var base = "%VITE_WASLAH_API_BASE%";
        if (base.charAt(0) === "%") base = "";
        base = base.replace(/\/$/, "");
        var initData = "";
        var wa = window.Telegram && window.Telegram.WebApp;
        if (wa && typeof wa.initData === "string") initData = wa.initData;
        if (initData.length === 0) {
          var pairs = window.location.hash.replace(/^#/, "").split("&");
          for (var i = 0; i < pairs.length; i += 1) {
            var eq = pairs[i].indexOf("=");
            if (eq > 0 && pairs[i].slice(0, eq) === "tgWebAppData") {
              try {
                initData = decodeURIComponent(pairs[i].slice(eq + 1).replace(/\+/g, "%20"));
              } catch (e) {
                initData = "";
              }
            }
          }
        }
        if (initData.length === 0) return;
        var s = fetch(base + "/v1/session/telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ initData: initData }),
        }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("preboot:" + r.status)); });
        var d = s.then(function (res) {
          var h = { authorization: "Bearer " + res.accessToken };
          // `ADR 0210`: الخادمُ يُضمِّنُ القراءتَينِ في ردِّ المبادلةِ فيسقطُ ذهابٌ وإيابٌ؛ وغيابُ إحداهما = نداؤها كما كانَ.
          var v = res.viewer ? Promise.resolve(res.viewer) : fetch(base + "/v1/me", { headers: h }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
          var c = res.consents ? Promise.resolve(res.consents) : fetch(base + "/v1/consents", { headers: h }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
          return { viewer: v, consents: c };
        });
        // المشتقّانِ يُستهلَكانِ برمزِ الجلسةِ وحدَه (`identity/preboot.ts`)، فلا يُقرآنِ بعدَ فشلِها. والمُعالِجُ الفارغُ
        // يمنعُ رفضًا غيرَ مُعالَجٍ مرّتين عندَ رفضِ `initData` — ولا يُغيِّرُ الوعدَينِ لمن يقرأ.
        var pv = d.then(function (x) { return x.viewer; });
        var pc = d.then(function (x) { return x.consents; });
        pv.catch(function () {});
        pc.catch(function () {});
        window.__waslahPreboot = {
          session: s,
          viewer: pv,
          consents: pc,
          accessToken: "",
        };
        s.then(function (res) {
          if (window.__waslahPreboot) window.__waslahPreboot.accessToken = res.accessToken;
        }, function () {});
        // `F1-09` · `D-31` · `ADR 0187`: `rider-home` لازمةٌ لسطحَي الراكبِ والسائقِ معاً، ولا تقرأُ دوراً.
        // زيادةٌ `D-34` · `ADR 0189`: تُسخَّنُ **معَ إرسالِ الجلسةِ لا بعدَ نجاحِها** — لا تعتمدُ على نتيجتِها، وانتظارُها
        // يضعُها بعدَ ذهابٍ وإيابٍ كاملٍ. الاسمُ يحقنُه `vite/warm-rider-home.ts` عندَ البناءِ؛ وفي التطويرِ تبقى العلامةُ فلا شيءَ.
        var warm = "__WASLAH_WARM_RIDER_HOME__";
        // زيادةٌ `PRD-009` · `ADR 0258`: القيمةُ قائمةٌ بفواصل — `rider-home` وتبعيّاتُها الثابتةُ خارجَ رسمِ المدخل.
        if (warm.charAt(0) === "/") {
          var w = warm.split(",");
          for (var i = 0; i < w.length; i++) {
            var l = document.createElement("link");
            l.rel = "modulepreload";
            l.href = w[i];
            document.head.appendChild(l);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
