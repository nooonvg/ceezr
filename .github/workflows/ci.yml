      # F12-12: المرحلةُ الثانيةُ من الفوترةِ الإلكترونيّةِ لـZATCA — UUID، تجزئة،
      # PIH، ICV، UBL 2.1، حالةُ إبلاغ. والكشفُ الفارغُ لا يُقرأُ نجاحاً (`ح-7`).
      - name: امتثال ZATCA المرحلة الثانية — UUID وتجزئة وPIH وUBL (F12-12)
        run: bun run scripts/check-zatca-phase2.ts

      # F9-05: بصمةُ التشغيل — تُكتَبُ بعد كلِّ وظيفةٍ بـ`if: always()`
      # حتى الإخفاقُ يُنتِجُ بصمةً تقولُ «failure» لا صمتاً.
      - name: بصمةُ التشغيل — كتابة (F9-05)
        if: always()
        env:
          JOB_NAME: verify
          CI_VERDICT: ${{ job.status }}
        run: |
          mkdir -p /tmp/run-manifests
          bun run scripts/emit-run-manifest.ts /tmp/run-manifests/verify.json

      # F9-05: الحاجزُ الساكن — يقرأُ البصمةَ ويحكمُ على كمالِ حقولِها.
      - name: بصمةُ التشغيل — حاجز (verify) (F9-05)
        if: always()
        env:
          RUN_MANIFEST_DIR: /tmp/run-manifests
          JOB_NAME: verify
        run: bun run scripts/check-run-manifest.ts

      # F12-06: الشعارُ والباركودُ في المركبة — روابطُ قراءةٍ موقَّعةٌ.
      # وجودُ المسارِ والمُوقِّعِ والقارئِ والعَرضِ في كلِّ ملفٍّ يمسُّه.
      # والكشفُ الفارغُ لا يُقرأُ نجاحاً (`ح-7`).
      - name: الشعارُ والباركودُ في المركبة — روابطُ قراءةٍ موقَّعةٌ (F12-06)
        run: bun run scripts/check-vehicle-logo-barcode.ts

      # يقرأُ نصَّ سكربتِ Lua ونصَّ الدالّةِ الذرّيّةِ ونصَّ الكتابةِ المباشرةِ، فيُسقِطُ
      # البناءَ إن افترقَ مُسنَدُ حارسِ التسلسلِ بينَ المخزنَينِ أو انقلبَ اتّجاهُه، أو
      # ضاعَت التنقيةُ من الدفعةِ، أو بُذِرَ رقمٌ في الشيفرةِ بدلَ `platform_settings`.
      # **ولا يلمسُ قاعدةً ولا Redis**: الأثرُ يُثبَتُ في اختباراتِ التكاملِ أدناه.
      - name: حَكَمٌ واحدٌ على الأحدثِ في المخزنَينِ، ولا رقمَ يُخترَعُ (F4-02 · CAP-009 · ADR 0072)
        run: bun run scripts/check-hot-location-state.ts

      # يمنعُ سقفَ تجمُّعٍ لا تعرفُه ميزانيّةُ الاتّصالاتِ، ودوراً مُعلَناً بلا مُستدعٍ،
      # وتنافرَ `DECLARED_TOPOLOGY` مع `render.yaml`. والعلّةُ أنّ صيغةَ ADR 0056
      # §٣-ج كانت **نصّاً** فتقادمَت بلا أن يُخطِرَ بها شيءٌ: خدمةُ اللوحةِ فُصِلَت
      # بتجمُّعِها والصيغةُ لا تراه. ولا يُقارَنُ المجموعُ بسقفِ المزوِّدِ: ذاكَ مُدخَلٌ
      # من خارجِ المستودعِ، وحاجزٌ أخضرُ على رقمٍ مُخترَعٍ يُطمئنُ زوراً (ح-5).
      - name: لا سقفَ اتّصالاتٍ خارجَ الميزانيّةِ، ولا تنافرَ مع مانيفستِ النشرِ (F7-04 · CAP-004 · ADR 0073)
        run: bun run scripts/check-connection-budget.ts

      # يمنعُ انشقاقَ الناقلِ المشتركِ **صامتاً**: مفتاحُ المجرى كانَ نصّاً حرفيّاً
      # مكرَّراً في حاويتَي البوّابةِ واللوحةِ، وتعديلُه في واحدةٍ دونَ الأخرى لا
      # يُخفِقُ ترجمةً ولا اختباراً — تُقلعُ العمليّتانِ خضراءَ وتنشرُ كلٌّ في مجراها،
      # فلا يرى مشتركو اللوحةِ أحداثَ البوّابةِ أبداً. ويمنعُ كذلكَ ناقلاً محليّاً بلا
      # غلافٍ موزَّعٍ، وغلافاً بلا ماسحٍ مُشغَّلٍ، وبانياً ثانياً في العمليةِ نفسِها.
      # **ولا يلمسُ Redis**: عبورُ الحدثِ بينَ النسخِ يُثبَتُ في اختباراتِ Redis الحقيقيّ.
      - name: مجرى أحداثٍ واحدٌ مشتركٌ لا ناقلُ عمليةٍ منعزلٌ (F4-03 · SCL-004 · ADR 0058)
        run: bun run scripts/check-tracking-event-carrier.ts

      # يمنعُ عودةَ العطبِ الذي دخلَ في `F4-02` **بلا سطرٍ خاطئٍ**: لمّا صارَ
      # الاستمرارُ مجمَّعاً كتبَت الدالّةُ `last_location_at = now()` لحظةَ الإفراغِ،
      # فادّعى العمودُ حداثةً لا يملكُها بمقدارِ دورةِ إفراغٍ كاملةٍ — وتلكَ القيمةُ
      # تُطبَعُ على صفحةِ التتبّعِ العامّةِ `SS-06` «آخرَ تحديثٍ»، ويُقاسُ منها عمرُ
      # الموقعِ في حاجزِ `driver_location_max_age_seconds`. ولا ترجمةٌ تُخفِقُ ولا
      # اختبارٌ يسقطُ عندَ مثلِ هذا. فالحاجزُ يفرضُ حملَ لحظةِ القبولِ من موضعِ
      # الاستقبالِ إلى الكتابةِ. **ولا يلمسُ القاعدةَ**: أنَّ الطابعَ يُكتَبُ كما
      # حُمِلَ يُثبَتُ في اختباراتِ PostgreSQL الحقيقيّ (حالاتُ ٨–١٠).
      - name: زمنُ قبولٍ محمولٌ لا `now()` لحظةَ الإفراغِ (F4-05 · CAP-009 · ADR 0076)
        run: bun run scripts/check-location-acceptance-stamp.ts

      # يمنعُ عودةَ أخطرِ ما وُجدَ في المسارِ: `/sos` كانَ فرعاً في `switch`
      # كسائرِ الفروعِ، والمُوزِّعُ يقرأُ دليلَ المستخدمِ **قبلَ كلِّ أمرٍ** ويردُّ
      # «حدثَ عطلٌ» عندَ إخفاقِها — فبنيةٌ سليمةٌ لكلِّ أمرٍ آخرَ كانت بابَ
      # إسقاطٍ لأخطرِ أمرٍ. وإسقاطُ استغاثةٍ لا يُرى في لوحةٍ ولا يُشتكى
      # منه: من ضغطَ الزرَّ ولم يُجَب لا يفتحُ تذكرةً. فالحاجزُ يفرضُ أنَّ
      # موضِعَ الاستقبالِ انتظارٌ واحدٌ على `triggerSos` بـ`orderId: null`، وأنَّ الأمرَ
      # يُوزَّعُ قبلَ أوّلِ `await`. **ولا يلمسُ القاعدةَ**: أنَّ الطلبَ يُحَلُّ
      # صحيحاً تحتَ القفلِ يُثبَتُ في اختباراتِ PostgreSQL الحقيقيِّ.
      - name: عزلُ مسارِ استقبالِ الاستغاثةِ (F8-05 · ADR 0077)
        run: bun run scripts/check-sos-intake-isolation.ts

      # يمنعُ عودةَ ثلاثةِ عيوبٍ كانت مجتمعةً في المستودعِ: أربعةُ مُصدِراتٍ
      # للسجلِّ بثلاثةِ أشكالٍ متعارضةٍ، وأربعةٌ وسبعونَ رسالةً نصّاً عربيّاً حرّاً
      # لا يُجمَعُ عليها ولا تُصفَّى، وعنوانُ عميلٍ خامٌ ومُعرِّفُ تلغرام خامٌ في
      # سجلاتِ البوابةِ. والسجلُّ لا تُخفِقُ به ترجمةٌ ولا يسقطُ به اختبارٌ:
      # عيبُه لا يُرى إلّا يومَ تُطلَبُ منه إجابةٌ فلا يُجيبُ، أو يومَ يُقرأُ فيه
      # ما لا يجوزُ أن يُكتَبَ. فالحاجزُ يفرضُ: `console` محصورٌ في المُصدِرِ
      # الوحيدِ، ورمزُ الحدثِ حرفيٌّ لاتينيٌّ منقوطٌ، ولا اسمَ حقلٍ شخصيّاً في
      # نداءِ تسجيلٍ، والمُصدِرُ قائمٌ بمضمونِه لا بمُجرَّدِ وجودِه. **ولا يلمسُ
      # القاعدةَ**: تصنيفُ شدّةِ كلِّ حدثٍ وتصديرُه إلى جامعٍ خارجيٍّ بندٌ آخرُ
      # (`F8-02` · `F8-07`)، والحدُّ مُعلَنٌ في ADR 0078.
      - name: سجلاتٌ مُهيكلةٌ بلا بياناتٍ شخصيّةٍ (F8-03 · ADR 0078)
        run: bun run scripts/check-structured-logging.ts

      # سلسلةُ ارتباطٍ واحدةٌ من الحافةِ إلى القاعدةِ وعبرَ الطابورِ: سجلٌّ لا
      # يُربَطُ سطرُه بسطرٍ لا يُجيبُ سؤالَ ليلةِ العطبِ «ما جرى لهذا الطلبِ»؛
      # وإنّما يُقرأُ فيه ألفُ سطرٍ متجاورٍ لا يُعرَفُ أيُّها من أيٍّ. والحاجزُ
      # يفرضُ **بنيةَ** السلسلةِ: عمودٌ وقيدٌ ومُشغِّلٌ لكلِّ جدولٍ موصولٍ، ولا
      # هجرةَ تُدرِجُ المعرِّفَ صريحاً بقيمةٍ من عندِها، واسمُ المتغيّرِ الجلسيِّ
      # في موضعٍ واحدٍ لا يُنسَخُ، وترويسةُ العميلِ الوارِدةُ **لا تُقرأُ أبداً**
      # (`ADR 0043`)، والحافةُ والشوطُ يلفّانِ عملَهما بسياقٍ، والمُصدِرُ يُلحِقُ
      # المعرِّفَ، وكلُّ موضعٍ موصولٍ مُعلَنٍ ملفوفٌ فعلاً. **ولا يلمسُ ناقلَ
      # OTel ولا جامِعَه**: ليسا في المستودعِ (`DEC-17` · `F9-01`)، فالبندُ `[~]`.
      - name: سلسلةُ ارتباطِ الطلبِ (F8-01 · OPS-002 · ADR 0129)
        run: bun run scripts/check-request-correlation.ts

      # صمودُ الاعتماديّاتِ: العطبُ الذي أُغلِقَ ههنا لم يكن سطراً خاطئاً بل
      # سطراً صحيحاً ظاهراً — `new Api(token)` في سبعةِ مواضعَ، يورِّثُ كلُّ واحدٍ
      # منها مهلةَ grammY الافتراضيّةَ: خمسَمئةَ ثانيةٍ. ولا يُخفِقُ بذلكَ اختبارٌ
      # ولا تُنبِّهُ به ترجمةٌ؛ إنّما يُرى يومَ يَبطُؤ المزوّدُ فتُعمِّرُ المقابسُ
      # المُهمَلةُ ثمانيَ دقائقَ وتُعادُ المحاولةُ فوقَها. فالحاجزُ يفرضُ: مصنعٌ
      # واحدٌ لواجهةِ تلغرام، وميزانيّةٌ لكلِّ اعتماديّةٍ مُسمّاةٍ، وحاجزٌ في كلِّ
      # محوّلِ خروجٍ، ومهلةٌ **مقروءةٌ** لا مكتوبةٌ رقماً، و`signal` في كلِّ `fetch`.
      # **ولا يُدَّعى معايرةُ الأرقامِ**: هيَ قراراتٌ مُعلَنةٌ، وقياسُها في `F10`.
      - name: صمودُ الاعتماديّاتِ — مهلةٌ وقاطعٌ وحدُّ تزامنٍ (F8-04 · CAP-006 · ADR 0079)
        run: bun run scripts/check-dependency-resilience.ts

      # عقودُ CORE مُستنسَخةٌ في `docs/contracts/core/` لأنَّ لا نفاذَ متبادلَ بينَ
      # المستودعَينِ (`DEP-CORE-005`)، ونسخةٌ ساكنةٌ من عقدٍ حيٍّ أخطرُ من غيابِه:
      # تُقرأُ كأنّها العقدُ فيُبنى عليها مُغلَّفٌ لا يقبلُه المُستهلِكُ. فالحاجزُ
      # يُطابِقُ حرفَ العقدِ المُستنسَخِ بما تُصدِرُه الطبقةُ وبآلةِ الحالاتِ
      # وبالهجرتَينِ: حقلاً حقلاً، وقيمةَ تعدادٍ قيمةً، وحالةً حالةً. **ولا يدّعي
      # طزاجةَ النسخةِ**: تحقيقُ ذلك آليّاً محجوبٌ بـ`DEP-CORE-005`، والبصماتُ في
      # `docs/contracts/core/PROVENANCE.md` هيَ ما يُقارَنُ يدوياً حتّى يُرفَعَ الحجبُ.
      - name: مطابقةُ عقودِ CORE — مُغلَّفٌ وحمولاتٌ وآلةُ حالاتٍ (W-4 · W-5)
        run: bun run scripts/check-core-contract-parity.ts

      # سلامةُ العقودِ المنقولةِ: تُعادُ بصمةُ كلِّ ملفٍّ في `docs/contracts/core/`
      # وتُقابَلُ بالمكتوبةِ في `PROVENANCE.md`. لزِمَ هذا لأنَّ المُنسِّقَ أعادَ
      # تنسيقَ مخطَّطَينِ منقولَينِ فبطلَت بصمتاهما وبقيَت دعوى «منقولٌ حرفاً»
      # مكتوبةً — دليلٌ كاذبٌ لا تكشفُه عينٌ.
      - name: سلامةُ العقودِ المنقولةِ — بصمةٌ تُعادُ لا تُصدَّقُ
        run: bun run scripts/check-vendored-contract-integrity.ts

      # يقيس التغطيةَ مرّةً أخرى بعدَ خطوةِ Test — عن قصدٍ لا سهواً: خطوةُ Test
      # تُغذّي حاجزَ قراءةِ الإخفاقِ من `/tmp/ci-output.log`، فلا يُمَسُّ أمرُها.
      # والقياسُ ههنا **لا يقيس اختباراتَ التكامل** لأنّها تتجاوز نفسَها بلا قاعدةٍ
      # حقيقيّةٍ في هذه الوظيفة، والحدُّ مُعلَنٌ في `scripts/lib/coverage-registry.ts`.
      - name: بوابةُ تغطيةٍ دنيا على المسارات الحرجة (OPS-005 · القسم 11-د · ADR 0048)
        run: bun run check:coverage

      # **تصحيحٌ مُضافٌ — تكافؤُ الإنفاذِ (2026-09-17 · ADR 0143):** سبعةُ حواجزَ
      # كانَت في `package.json → ci` **ولا تُنادى في أيِّ سيرِ عملٍ** — لا ههنا ولا
      # في غيرِها. ووثيقتانِ تدَّعيانِ صراحةً أنَّ إحداها «حاجزُ CI قائمٌ». وهوَ
      # عينُ عطبِ `F6-07` أعلاه مكرَّراً سبعَ مرّاتٍ: **حاجزٌ لا يُسقِطُ بناءً بعيداً
      # ليسَ حاجزاً**، إنّما عادةٌ محلّيّةٌ تنكسرُ بأوّلِ من ينسى. فأُضيفَت خطواتٍ
      # ههنا، وأُضيفَ حاجزٌ يقيسُ التكافؤَ نفسَه كي لا يتكرَّرَ بلا مُكتشِفٍ.
      - name: مِلكيّةُ الحذفِ لكلِّ جدولٍ حكماً لا أمراً (F2-11 · ADR 0112)
        run: bun run scripts/check-erasure-policy.ts

      - name: سياسةُ الاستبقاءِ مُعلَنةٌ لكلِّ بياناتٍ تُعمَّرُ (F7-06 · CAP-010)
        run: bun run scripts/check-retention-policy.ts

      - name: سياسةُ العمولةِ مكتوبةٌ ومرئيةٌ (F12-17)
        run: bun run scripts/check-commission-policy.ts

      - name: سياسةُ تخزينِ المساراتِ — لا نداءَ لكلِّ نبضة (CAP-012)
        run: bun run scripts/check-route-cache-policy.ts

      - name: أمانُ الاستعادةِ — لا هجرةَ تُكسِرُ الرجوعَ (OPS-010)
        run: bun run scripts/check-rollback-safety.ts

      - name: ثابتُ المثيلِ الواحدِ مفروضٌ في النصِّ لا موصىً به (SCL-002 · ADR 0050)
        run: bun run scripts/check-instance-invariant.ts

      - name: منطقةُ التأجيلِ لا تُستورَدُ ولا تُطبَّقُ ولها README (O-7 · ADR 0095)
        run: bun run scripts/check-deferred-area.ts

      - name: عقدُ شاشةِ اشتراكِ السائقِ (F3-06)
        run: bun run scripts/check-driver-subscription-contract.ts

      - name: عقدُ شاشةِ مركبةِ السائقِ (F3-07)
        run: bun run scripts/check-driver-vehicle-contract.ts

      # والحاجزُ الذي يحرسُ الحواجزَ: يقابلُ المشغِّلَ بسيرِ العملِ بالقرصِ في
      # الاتجاهاتِ الثلاثةِ، ويفكُّ الأسماءَ المتداخلةَ، **ولا يقرأُ تعليقاً تنفيذاً**
      # (وذاكَ بعينِه ما أخفى الخلَلَ في أوّلِ قياسٍ). فلا يتقادمُ بإضافةِ حاجزٍ
      # جديدٍ: مصدرُ حقيقتِه المستودعُ نفسُه لا قائمةٌ تُصانُ يدويًّا.
      - name: كلُّ حاجزٍ يُنفَّذُ حيثُ يُدَّعى — محلّيًّا وفي CI (ADR 0143)
        run: bun run scripts/check-guard-enforcement.ts

      - name: سقوطُ حاجزِ تكافؤِ الإنفاذِ مقيسٌ بسالبةٍ مزروعةٍ لكلِّ قاعدةٍ (ح-7)
        run: bun test tests/unit/check-guard-enforcement.test.ts

      # وحاجزُ التكافؤِ أعلاه يقيسُ **العضويّةَ** لا **الصلاحيّةَ**: أنَّ الحاجزَ
      # مذكورٌ في الجانبَينِ، لا أنَّه يُنادى كما كُتِبَ. وذاكَ حدُّه المُعلَنُ الذي
      # أوقعَ عطباً حقيقيًّا: `check-no-skipped-tests.ts` أُدرِجَ في السلسلةِ بلا
      # وسيطِ سجلٍّ فكانَ يُخفِقُ في كلِّ نداءٍ محلّيٍّ، **ودُمِجَ خضراءَ** لأنَّ CI لا
      # تُشغِّلُ سلسلةَ `bun run ci`. فهذا الحاجزُ يسدُّ ذاكَ الحدَّ سدًّا ساكناً.
      - name: كلُّ أمرٍ في المشغِّلِ يُنادى كما كُتِبَ (D-24)
        run: bun run scripts/check-runner-command-validity.ts

      - name: سقوطُ حاجزِ صلاحيّةِ النداءِ مقيسٌ بسالبةٍ مزروعةٍ ومنها العطبُ التاريخيُّ (ح-7)
        run: bun test tests/unit/check-runner-command-validity.test.ts

      # F9-01 · OPS-001 · ADR 0206: مخطّطُ staging مُشتقٌّ من render.yaml بفرقٍ مُعلَنٍ مغلقٍ
      # والحاجزُ يُعيدُ الاشتقاقَ ويُقارنُ بايتاً ببايتٍ — فلا تتباعدُ staging عن الإنتاجِ
      # بسهوٍ، وكلُّ بعدٍ من OPS-001 مُصنَّفٌ (مُنفَذٌ بالاشتقاقِ أو خارجيٌّ بحاجزٍ قائمٍ).
      - name: staging مُشتقّةٌ من الإنتاجِ بلا تباعدٍ (F9-01 · OPS-001)
        run: bun run scripts/check-staging-blueprint.ts

      - name: سقوطُ حاجزِ اشتقاقِ staging مقيسٌ بسالباتٍ مزروعةٍ (ح-7)
        run: bun test tests/unit/staging-blueprint.test.ts

      # ADR 0246 · Production Readiness Gate: منعُ الادعاء بجاهزية الإنتاج
      # ما دامَ أيُّ بندٍ في البوابة مفتوحًا. حارسٌ ساكنٌ يقرأُ البوابة
      # ويتحقّقُ من SYSTEM_STATE و ROADMAP و ROADMAP-MASTER.
      - name: بوابة جاهزية الإنتاج — لا ادعاء Production Ready بلا أدلة (ADR 0246)
        run: bun run scripts/check-production-readiness-gate.ts

      # F9-04: حتميّةُ بذرةِ القياس — الدوالُّ الصرفةُ تُنتجُ البصمةَ نفسَها.
      - name: حتميّةُ بذرةِ القياس — بصمةٌ ثابتةٌ وUUIDv5 صالح (F9-04)
        run: bun run scripts/check-bench-seed-determinism.ts

      - name: سقوطُ حاجزِ حتميّةِ البذرةِ مقيسٌ بسالبةٍ مزروعةٍ (ح-7)
        run: bun test tests/unit/bench-determinism.test.ts

      - name: لا نصّ ظاهر للمستخدم مكتوب داخل منطق الحوار
        run: |
          if grep -rnE '(reply\(sender, ")[^t]' packages/application/bots/ ; then
            echo "❌ نصّ مباشر داخل منطق الحوار: كل نصّ يمرّ عبر i18n"; exit 1;
          fi
          echo "✅ كل نصوص الحوار من القواميس"

  integration:
    name: تكامل على PostgreSQL حقيقي
    runs-on: ubuntu-latest
    # أطولُ تشغيلٍ ناجحٍ مقيسٍ لهذه الوظيفةِ ≈ ٣ دقائقَ (ADR 0122).
    timeout-minutes: 25
    # يُلزم الرقيبَ بالإخفاق لو ضاع رابطُ القاعدة من هذه الوظيفة: اختباراتُ
    # التكامل تُتخطّى بصمتٍ حين يغيب، فيُعلَن الفحصُ أخضرَ بلا تجريبِ SQL أصلاً.
    env:
      CI_REQUIRE_DB: "1"
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      # `BUG-017`: autovacuum was inflating `pg_stat_database` block-touch
      # counters during the ride-soak test. The soak test measures engine
      # work via `blks_read + blks_hit` from `pg_stat_database`, which
      # includes ALL block accesses — including autovacuum's. On a fresh
      # CI database with default autovacuum settings, autovacuum can trigger
      # during the warm-baseline window (rides 11–20), inflating the
      # `blocksTouched` delta by up to 161% (32481 vs 12430 on the same
      # commit, same code — run 35428393006 first attempt vs rerun).
      # The asymmetry (161% blocks vs 61% rows) is the signature of
      # autovacuum: it scans many blocks looking for dead tuples but
      # doesn't return tuples through the normal query path.
      # Disabling autovacuum here is a root-cause fix, not a budget raise:
      # the test measures application query work, not PostgreSQL
      # maintenance work. The budget (`scripts/lib/work-budget.ts`)
      # is not touched.
      - name: تعطيل autovacuum لقياسٍ حتميٍّ في اختبار الصمود (BUG-017)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          alter system set autovacuum = off;
          select pg_reload_conf();
          SQL


      # مصدرُ الحقيقةِ الواحدُ لتطبيقِ الهجراتِ: `scripts/migrate.ts` (F7-07 · ADR 0068).
      # وحلقةُ `psql` العارية أُزيلَت لأنّها كانت تُطبِّق على CI بطريقٍ يخالف طريقَ
      # الإنتاج، فيصير الأخضرُ شاهداً على غيرِ ما يُشغَّل. والمُطبِّقُ يحكم على كلِّ
      # ملفٍّ قبل الاتّصال، ويضبط `lock_timeout`، ويملك المعاملةَ.
      #
      # تصحيحٌ بالإضافةِ (F5-06 · 2026-09-09): هذه الخطوةُ عادت إلى حلقةِ `psql`
      # في `a16bf97` — حلُّ تعارضٍ في دمجِ main إلى فرعِ F7-02 أخذَ نسخةَ الملفِّ
      # السابقةَ لـF7-07 — فبقيَ ADR 0068 يقولُ ما لا يفعلُه CI. أُعيدَت هنا،
      # وحاجزُ `scripts/check-migration-applier.ts` يمنعُ عودةَ العيبِ صامتاً.
      - name: تطبيق الهجرات بالمُطبِّقِ الآمنِ
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/migrate.ts

      # `W-9` · ADR 0088: يُقاسُ **عجزُ** تمرينِ التحوُّلِ عن الكتابةِ على قاعدةٍ
      # حقيقيّةٍ — لا يُفترَضُ. والمُنفِّذُ يُخفِقُ لو نجحَت كتابةٌ داخلَ معاملتِه،
      # ولو زعمَ تمريناً تامّاً. ولا تحوُّلَ يجري: `B-5` مفتوحٌ والرفضُ بالإنشاءِ.
      - name: تمرينُ التحوُّلِ يرفضُ بالإنشاءِ ولا يكتبُ حرفاً (W-9 · ADR 0088)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/rehearse-cutover.ts

      # `pg_dump` يرفض خادماً أحدثَ منه إصداراً رئيسياً، واختبارُ تحقّقِ الاستعادة
      # يستدعيه فعلاً على خدمةِ PostgreSQL 17 — أمّا صورةُ العامل فتحمل أدواتَ
      # إصدارٍ أقدم. النتيجةُ إخفاقٌ لا يظهر محلّياً حيث النسختان متوافقتان، فيبدو
      # كعيبٍ في منطقِ النسخ الاحتياطيّ وهو عيبُ بيئةٍ صِرْف. فتُثبَّت أدواتُ العميل
      # من مستودعِ PostgreSQL الرسميّ، ثم يُقارَن الإصدارانِ ويسقط البناءُ بالسببِ
      # مكتوباً إن اختلفا — لا سقوطاً صامتاً ولا تخطّياً للاختبار.
      - name: أدواتُ عميلِ PostgreSQL مطابقةٌ لإصدارِ الخادم
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          server_major="$(psql -h localhost -U postgres -d waslah -tAc 'show server_version' | cut -d. -f1 | tr -d '[:space:]')"
          echo "الخادم: إصدار رئيسيّ $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(lsb_release -cs)"
          repo="https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main"
          signed="signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc"
          printf 'deb [%s] %s\n' "$signed" "$repo" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${server_major}"
          echo "/usr/lib/postgresql/${server_major}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${server_major}/bin:$PATH"
          for tool in pg_dump pg_dumpall pg_restore psql; do
            version="$("$tool" --version)"
            echo "$tool: $version"
            tool_major="$(echo "$version" | grep -oE '[0-9]+' | head -1)"
            if [ "$tool_major" != "$server_major" ]; then
              echo "::error::$tool إصداره $tool_major والخادم $server_major — pg_dump يرفض خادماً أحدثَ منه، فتحقّقُ الاستعادة يُخفق لسببِ بيئةٍ لا لسببِ منطق."
              exit 1
            fi
          done

      - name: تمرين مسار العودة — الهجرات واحدةً واحدةً على قاعدة حقيقية
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/rollback-schema-drill.ts

      # يُثبِتُ الحاجزُ الساكنُ أنَّ الإدراجَ **مكتوبٌ**، وهذا يُثبِتُ أنَّ الصفَّ
      # **يُكتَبُ** عندَ النجاحِ **ولا يُكتَبُ** عندَ الرفضِ — وبينَهما فرقُ جنسٍ
      # لا درجةٍ. وخطوةٌ باسمِها كي يُقرأَ الحكمُ مفرَداً لا مُبتلَعاً في مجموعةٍ.
      - name: أثرُ الأفعالِ المُتسلِّطةِ مقيسٌ بالأثرِ لا بالنصِّ (SEC-12)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/audit-trail-authority.test.ts

      # `I1` (ADR 0286) — قيدُ الإسنادِ الأحاديِّ كاختبارِ انحدارٍ محميٍّ في مسارِ CI
      # نفسِه: سباقاتٌ متزامنةٌ حقيقيّةٌ بتداخلٍ مُثبَتٍ بقفلِ تحكُّمٍ (يُعدُّ المحجوبانِ
      # من مساراتِ الاختبارِ نفسِها بمعرّفِ الجلسةِ — لا بنمطٍ نصيٍّ)، وهويّاتُ الملفِ
      # معزولةٌ بتنقيةٍ موجّهةٍ (لا truncate عامّاً يزاحم الملفاتِ المتوازيةَ — درسُ
      # المرحلةِ 9). وبإزالةِ الفهرسِ أو حارسِ claim_ride يفشلُ عمدًا (أدلةُ المرحلةِ 3
      # من CAP-RUN-20261016-CONTINUATION).
      - name: سباقاتُ الإسنادِ الأحاديِّ المتزامنةُ على PostgreSQL حقيقيٍّ (I1)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/i1-concurrent-engagement-races.test.ts

      # `LOAD-01` (P4) · الدفعةُ الثامنةُ: قراءةُ لوحِ العروضِ بجولةِ قاعدةٍ واحدةٍ —
      # تكافؤٌ حرفيٌّ مع المسارِ القديمِ (لوحٌ + ملاحقٌ + أهليةٌ) وعدّادُ عباراتٍ = 1
      # على قاعدةٍ حقيقيةٍ، واللوحُ الفارغُ ورفضُ USER_NOT_FOUND كما كانَا.
      - name: لوحُ العروضِ بجولةِ قاعدةٍ واحدةٍ على PostgreSQL حقيقيٍّ (LOAD-01 · P4)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/driver-offer-board-single-read.test.ts

      # `LOAD-01` (P2) · الدفعةُ 15 (ADR 0290): القبولُ وإيداعُ MATCHED في عبارةٍ واحدة —
      # ردُّ القبولِ حرفاً، ونقطةُ الحفظِ تعزلُ فشلَ الإيداعِ والقبولُ يُثبَّت، وWR-09 والسباقُ وI1.
      - name: القبولُ وإيداعُ MATCHED في رحلةٍ واحدةٍ على PostgreSQL حقيقيٍّ (LOAD-01 · P2)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/accept-with-matched-notice.test.ts

      # `F8-06`: أطوارُ دورةِ حياةِ الدفعِ (نجاحٌ · فشلٌ · معلّقٌ · مكرّرٌ · استرجاعٌ ·
      # تناقضٌ) **يُشغِّلُها المحرِّكُ** لا الحاجزُ الساكنُ. وخطوةٌ باسمِها كي يُقرأَ
      # حُكمُها مفرَداً لا مُبتلَعاً في حزمةٍ من خمسٍ وخمسينَ.
      - name: مصفوفةُ أطوارِ دورةِ حياةِ الدفعِ على محرِّكٍ حقيقيٍّ (F8-06)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/payment-lifecycle-matrix.test.ts

      # `F12-08`: إبلاغُ حوادثِ اختراقِ البياناتِ الشخصيّةِ — المادةُ ٢٤ من اللائحةِ
      # التنفيذيّةِ لـPDPL. خمسُ حالاتٍ على PostgreSQL حقيقيٍّ: تسجيلُ الحادثِ ·
      # موعدُ ٧٢ ساعةً · تقييمُ الخطرِ · كشفُ الانقضاءِ · تسجيلُ إبلاغَي الهيئةِ
      # وأصحابِ البياناتِ. وخطوةٌ باسمِها كي يُقرأَ حُكمُها مفرَداً.
      - name: إبلاغُ حوادثِ اختراقِ البياناتِ على PostgreSQL حقيقيٍّ (F12-08)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/breach-notification.test.ts

      # `F12-10`: امتثال PDPL — أساسُ المعالجةِ، حقوقُ أصحابِ البياناتِ، تقييمُ
      # الأثرِ، وضوابطُ النقلِ خارجَ المملكةِ. الموادُّ ٤ و١٠ و١٣ و١٨ و٢٢ و٢٩ و٣١.
      # ستُّ حالاتٍ على PostgreSQL حقيقيٍّ: نشاطٌ بلا أساسٍ · نشاطٌ عاليُ الخطرِ
      # بلا DPIA · DPIA معتمدٌ · نقلٌ مرفوضٌ افتراضياً · نقلٌ معتمدٌ غيرُ منتهٍ ·
      # طلبُ حقٍّ له مهلةٌ وحالاتُ انتقالٍ. وخطوةٌ باسمِها كي يُقرأَ حُكمُها مفرَداً.
      - name: امتثال PDPL على PostgreSQL حقيقيٍّ (F12-10)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/pdpl-compliance.test.ts

      # F12-12: اختباراتُ المرحلةِ الثانيةِ من امتثال ZATCA على PostgreSQL حقيقيٍّ.
      # بذرةُ PIH · دوالُ UUID والتجزئة والعدّاد · UBL XML · سلسلةُ الفواتير.
      - name: امتثال ZATCA المرحلة الثانية (F12-12)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/zatca-phase2.test.ts

      # `SEC-10` · ADR 0140: الحاجزُ الساكنُ يُثبِتُ أنَّ `RLS` **مكتوبٌ**، وهذا
      # يُثبِتُ ما **تفعلُه القاعدةُ** بدورٍ `nobypassrls` يُنشِئُه الاختبارُ: منعٌ
      # شاملٌ حيثُ لا سياسةَ · إذنٌ شاملٌ لِـ`service_role` · وتجاوزُ المالكِ الذي
      # تردُّه `force` وحدَها. وخطوةٌ باسمِها كي يُقرأَ الحكمُ مفرَداً؛ ولو صارَ
      # `RLS` زخرفةَ مخطَّطٍ لَبقيَ الساكنُ أخضرَ وسقطَ هذا.
      - name: أثرُ أمنِ الصفِّ مقيسٌ بدورٍ غيرِ مالكٍ لا موصوفٌ (SEC-10)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/row-security-effect.test.ts

      # `F1-09`: استهلاكُ جلسةِ راكبٍ يُقاسُ ردّاً ردّاً وإطاراً إطاراً على بوّابةٍ
      # وقاعدةٍ وقناةِ `socket.io` حقيقيّةٍ، ثمَّ يُحاكَمُ بحدِّ القسمِ 9.9. وخطوةٌ
      # باسمِها كي يُقرأَ حُكمُها — والأرقامُ المقيسةُ — مفرَداً لا مُبتلَعاً في حزمةٍ.
      - name: استهلاكُ بياناتِ جلسةِ راكبٍ في عشرِ دقائقَ مقيسٌ لا مُقدَّرٌ (F1-09)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/rider-session-data-budget.test.ts

      # `ECO-002`: نداءاتُ مزوّدِ التوجيهِ تُعَدُّ على **السِلكِ** — خادمٌ يُصغي على
      # منفذٍ حقيقيٍّ يعدُّ الطلباتَ، وبوّابةٌ من `buildContainer` بضبطِ `osrm`،
      # وقاعدةٌ حقيقيّةٌ. وخطوةٌ باسمِها كي يُقرأَ الرقمُ مفرَداً: صفرُ نداءاتٍ في
      # ستّينَ نبضةً، ونداءاتٌ منعَها التخزينُ، ومجموعٌ تحتَ سقفٍ مُشتَقٍّ.
      - name: عددُ نداءاتِ التوجيهِ في رحلةٍ واحدةٍ معدودٌ على السِلكِ (ECO-002)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/routing-call-budget.test.ts

      # `F11-06` (الشقُّ المملوكُ للمستودَعِ): عطلُ مزوّدِ الخرائطِ **محقونٌ على السِلكِ**
      # — خادمُ `OSRM` حقيقيٌّ يُطفَأُ ويُعلَّقُ ويردُّ 5xx وحمولةً فاسدةً، وحصّةٌ مستنفَدةٌ،
      # وقاطعٌ مفتوحٌ ثمَّ تعافٍ. وخطوةٌ باسمِها كي يُقرأَ الحكمُ مفرَداً: الرحلةُ عينُها،
      # والمدّةُ `PROVIDER_DOWN`، والقراءةُ تحتَ ميزانيّةِ المزوّدِ (`ADR 0192`).
      - name: توقُّفُ مزوّدِ الخرائطِ لا يُخفي الرحلةَ والمدّةُ تُخفى بصدقٍ (F11-06)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/routing-provider-outage.test.ts

      # `F11-02` (الشقُّ المملوكُ للمستودَعِ): عمليّةُ عاملٍ **حقيقيّةٌ** تُقتَلُ بـ`SIGKILL`
      # وهيَ تحملُ القفلَ الاستشاريَّ وحجزَ الصادرِ، وعاملٌ ثانٍ حيٌّ يتسلَّمُ. وخطوةٌ باسمِها
      # كي يُقرأَ الحكمُ مفرَداً: القفلُ يُحرَّرُ بموتِ الجلسةِ، والصفُّ يُسلَّمُ مرّةً، ورمزُ
      # الميّتِ مرفوضٌ، والرسائلُ ضمنَ الحدِّ المُعلَنِ (`ADR 0195`).
      # `F11-07` (الشقُّ المملوكُ للمستودَعِ): عطلُ مزوّدِ الدفعِ **محقونٌ على السِلكِ** —
      # خادمُ Tap محليٌّ يُطفَأُ ويُعلِّقُ ويردُّ 5xx وحمولةً فاسدةً، ومعاملةٌ على قاعدةٍ
      # حقيقيّةٍ في كلِّ طورٍ: الشحنةُ تفشلُ بصدقٍ ولا قيدَ ولا تفعيلَ، والمراجعةُ تُعلنُ
      # فشلَها وتُبقي الصفَّ معلَّقاً، والتعافي يُعيدُ للسائقِ رابطَهُ ويُسوّي مرّةً واحدةً
      # (`D-38` · `ADR 0200`).
      - name: توقُّفُ مزوّدِ الدفعِ لا يُفسِدُ معاملةً ولا يسجنُ سائقاً (F11-07)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/payment-provider-outage.test.ts

      # `F11-10` (الشقُّ المملوكُ للمستودَعِ): تمرينُ استعادةِ النسخةِ الاحتياطيّةِ
      # **موثَّقاً بالزمنِ الفعليِّ** — التمرينُ الكاملُ (`pg_dump` ثم تسجيلٌ ثم
      # استعادةٌ في قاعدةٍ مستقلّةٍ ثم بصمةٌ وتكافؤٌ) بأطوارٍ مقيسةٍ بالساعةِ
      # تُطبَعُ في سجلِّ التشغيلِ وتُسجَّلُ في `db_backups`. ولا سقفَ ولا `RTO`:
      # الزمنُ على قاعدةِ حجمِ الهجراتِ في عدّاءِ CI (`B-1` · ADR 0047 §٣).
      - name: تمرينُ استعادةِ النسخةِ الاحتياطيّةِ موثَّقاً بالزمنِ الفعليِّ (F11-10)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/backup-restore-drill.ts

      - name: فقدانُ عمليّةِ عاملٍ حقيقيّةٍ يُعادُ استلامُ عملِها بلا تكرارِ أثرٍ (F11-02)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/worker-loss-reclaim.test.ts

      # `LOAD-01` (P4) · الدفعةُ الثامنةُ: الالتقاطُ لا يستهلكُ العروضَ المحسومةَ —
      # لا التقاطَ ولا حجبًا ولا عدّادَ محاولاتٍ يزيدُ، وتزامنُ مُلتقطَينِ ومسارُ إعادةِ
      # المحاولةِ والكنسُ الدوريُّ على قاعدةٍ حقيقيةٍ (هجرةُ 20261018130000).
      - name: الالتقاطُ لا يستهلكُ المحسومَ على PostgreSQL حقيقيٍّ (LOAD-01 · P4)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/claim-skip-decided-offers.test.ts

      # `ECO-003`: رسائلُ تيليجرام تُعَدُّ على **السِلكِ** — مُرسِلٌ يُلتقَطُ خروجُه
      # نصّاً وصورةً ودبّوساً، وبوّابةٌ من `buildContainer` تمرُّ بالـwebhook وصندوقِ
      # الصادرِ. وخطوةٌ باسمِها كي يُقرأَ الرقمُ مفرَداً: خمسُ رسائلِ دفعٍ في رحلةٍ
      # كاملةٍ من سقفٍ مُشتَقٍّ، ونصيبُ البثِّ وحدَه ينمو بعددِ السائقينَ.
      - name: عددُ رسائلِ تيليجرام في رحلةٍ واحدةٍ معدودٌ على السِلكِ (ECO-003)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/telegram-message-budget.test.ts

      # `ECO-004` (الزيادةُ الأولى): مواردُ رحلةٍ واحدةٍ تُقاسُ على السِلكِ —
      # `pg_stat_database` للصفوفِ والكُتَلِ، و`notification_outbox` + `order_offers`
      # للطابورِ، وعميلُ `Redis` مُحقونٌ يَعُدُّ، وبايتاتُ ردودِ `HTTP` للنقلِ،
      # وعدُّ الصفوفِ المُدخَلةِ للتخزينِ. وخطوةٌ باسمِها كي يُقرأَ الرقمُ مفرَداً.
      - name: مواردُ رحلةٍ واحدةٍ مقيسةٌ على السِلكِ — خمسةُ أسطحٍ (ECO-004 · الزيادةُ الأولى)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/resource-usage-budget.test.ts

      # `ECO-008` (الشقُّ المملوكُ للمستودَعِ): عشرُ رحلاتٍ متتابعةٍ بالشكلِ المُعلَنِ
      # في حاويةٍ واحدةٍ — يقيسُ هل يبقى نصيبُ الرحلةِ من المواردِ ثابتاً معَ
      # توالي الرحلاتِ (نموٌّ خطّيٌّ) أم يتضخّمُ. السقوفُ الحجميّةُ مُشتقّةٌ من
      # سقوفِ الرحلةِ الواحدةِ (ECO-004) — لا سقوفاً جديدةً تُكتَبُ رقماً.
      - name: حسّاسيّةُ شكلِ التكلفةِ عندَ ١٠x من حجمِ الرحلاتِ مقيسةٌ على السِلكِ (ECO-008)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/cost-sensitivity.test.ts

      - name: مقاماتُ التكلفةِ لكلِّ مستخدمٍ نشطٍ ولكلِّ رحلةٍ محروسةٌ (ECO-001 · الزيادةُ الأولى)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/eco-user-cost.test.ts

      # `ECO-006` (شقُّ قياسٍ أوّليٌّ · ADR 0180): التذاكرُ النظاميّةُ في مسارِ
      # إيكالٍ ← وصولٍ ← بدءٍ ← إنهاءٍ بدوالِّ النظامِ تُعَدُّ على السِلكِ، والانتقالاتُ
      # من `audit_log`. لا تقييمَ ولا إلغاءَ ولا معدَّلَ مستخدمينَ ولا سعرَ.
      - name: تذاكرُ الدعمِ لكلِّ رحلةٍ مقيسةٌ على السِلكِ (ECO-006 · الشقُّ المملوكُ للمستودَعِ)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/support-volume-budget.test.ts

      - name: فعلُ تعذُّرِ الإكمالِ على PostgreSQL حقيقيّة (PD-020)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun test tests/integration/driver-cannot-complete.test.ts

      - name: اختبارات التكامل على قاعدة حقيقية
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:integration 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      # الخطوةُ السابقةُ كانت تُعيد تشغيلَ الحزمةِ كاملةً ثمّ تبحث بـ`grep` عن جملةِ
      # تحذيرٍ يكتبها كلُّ ملفٍّ بيدِه — وأربعةٌ وعشرون ملفّاً من خمسةٍ وخمسين لا تطبعها،
      # فكانت تلك الملفّاتُ تُتجاوَز صامتةً والحاجزُ أخضرُ (OPS-009). والآن يُقرَأ
      # **ملخَّصُ المُشغِّلِ نفسِه** من سجلِّ الخطوةِ السابقةِ بلا إعادةِ تشغيلٍ.
      - name: منع تخطّي اختبارات التكامل صامتاً
        run: bun run scripts/check-no-skipped-tests.ts /tmp/ci-output.log

      # e2e منفصلة عن التكامل لأنها أطول وتراكمية: ثلاثون رحلة على حالة واحدة
      # لا تُنظَّف بينها. فصلها يجعل فشلها مقروءاً بذاته لا مبتلعاً في حزمة كبيرة.
      - name: اختبارات e2e — رحلات متتابعة بلا تدخّل
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:e2e 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      # وكذلك e2e: يُقرَأ سجلُّ خطوتِها وحدَه (وقد أعاد `tee` كتابتَه بعد التكامل).
      - name: منع تخطّي اختبارات e2e صامتاً
        run: bun run scripts/check-no-skipped-tests.ts /tmp/ci-output.log

      # F9-05: بصمةُ التشغيلِ للتكامل.
      - name: بصمةُ التشغيل — كتابة (integration) (F9-05)
        if: always()
        env:
          JOB_NAME: integration
          CI_VERDICT: ${{ job.status }}
        run: |
          mkdir -p /tmp/run-manifests
          bun run scripts/emit-run-manifest.ts /tmp/run-manifests/integration.json

      # F9-05: الحاجزُ الساكن.
      - name: بصمةُ التشغيل — حاجز (integration) (F9-05)
        if: always()
        env:
          RUN_MANIFEST_DIR: /tmp/run-manifests
          JOB_NAME: integration
        run: bun run scripts/check-run-manifest.ts

  # وظيفةٌ ثالثةٌ لا خطوةٌ في القائمتَين: هذه وحدَها تُخاطِب خدمةً خارجيّةً حقيقيّةً
  # بسرٍّ من مخزنِ أسرارِ المستودعِ (OPS-006 · ADR 0049). وفصلُها مقصودٌ لسببَين:
  # أنّ سقوطَها لسببِ شبكةٍ لا يجوز أن يُخفي نتيجةَ الحواجزِ في `verify`، وأنّ السرَّ
  # لا يُحمَّل في بيئةِ خطوةٍ لا تحتاجه.
  #
  # وحدُّها المُعلَنُ: طلبُ دمجٍ من نسخةٍ متشعّبةٍ لا يُمنَح أسرارَ المستودعِ في
  # GitHub Actions أصلاً، فتُتخطّى الوظيفةُ هناك — ولا يُتخطّى شيءٌ في الدفعِ إلى
  # `main` ولا في طلبِ دمجٍ من المستودعِ نفسِه، وهو مسارُ هذا المستودعِ الفعليّ.
  real-redis:
    name: تكامل على Redis حقيقي
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # أطولُ تشغيلٍ ناجحٍ مقيسٍ لهذه الوظيفةِ ≈ ٤٠ ثانيةً (ADR 0122).
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # `S-3` · `O-2`: خادمُ Redis **حقيقيٌّ** مُستضافٌ في الشغلةِ نفسِها بدلَ سِرٍّ
      # خارجيٍّ لم يُضبَطْ قطُّ — وغيابُه كانَ يُسقِط هذه الوظيفةَ في كلِّ جريةٍ.
      # والاستقلالُ التجاريُّ (ADR 0094) يقتضي ألّا يتوقّفَ حكمُ CI على حسابٍ عندَ
      # مُزوِّدٍ لا يملكُه المشروعُ.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # قشرةُ REST تُنطِق Redis بروتوكولَ Upstash الذي يتكلّمُه كودُ الإنتاجِ
      # (`packages/infrastructure/redis/upstash.ts`) حرفاً بحرفٍ: `POST` لمصفوفةِ
      # أمرٍ و`Bearer` للرمزِ. فالمُخاطَبُ خادمٌ حقيقيٌّ والبروتوكولُ بروتوكولُ
      # الإنتاجِ — لا عميلٌ مزدوجٌ ولا محاكاةٌ في الذاكرةِ.
      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: waslah-ci-real-redis
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ["8079:80"]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # الجهوزيّةُ تُقاسُ بأمرٍ يمرُّ بالقشرةِ إلى الخادمِ لا بفحصِ منفذٍ مفتوحٍ:
      # المنفذُ يُفتَح قبلَ أن تُتِمَّ القشرةُ اتّصالَها بـRedis، فيسقطُ أوّلُ اختبارٍ
      # على سببٍ لا علاقةَ له بالمقيسِ، فيُقرَأ الأحمرُ الزمنيُّ عيباً في الكودِ.
      - name: جهوزية قشرة REST على Redis حقيقي
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS -X POST http://localhost:8079 \
              -H 'authorization: Bearer waslah-ci-real-redis' \
              -H 'content-type: application/json' \
              -d '["PING"]' 2>/dev/null || true)
            case "$body" in *PONG*) echo "✅ Redis حقيقيٌّ مُجيبٌ عبرَ REST بعدَ ${i} محاولةً"; exit 0;; esac
            sleep 2
          done
          echo "✗ قشرةُ REST لم تُجِبْ PING من خادمِ Redis في ثمانينَ ثانيةً — ولا تُقرَأ الوظيفةُ خضراءَ بلا خادمٍ." >&2
          exit 1

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      # مصدرُ الحقيقةِ الواحدُ لتطبيقِ الهجراتِ: `scripts/migrate.ts` (F7-07 · ADR 0068).
      # وحلقةُ `psql` العارية أُزيلَت لأنّها كانت تُطبِّق على CI بطريقٍ يخالف طريقَ
      # الإنتاج، فيصير الأخضرُ شاهداً على غيرِ ما يُشغَّل. والمُطبِّقُ يحكم على كلِّ
      # ملفٍّ قبل الاتّصال، ويضبط `lock_timeout`، ويملك المعاملةَ.
      #
      # تصحيحٌ بالإضافةِ (F5-06 · 2026-09-09): هذه الخطوةُ عادت إلى حلقةِ `psql`
      # في `a16bf97` — حلُّ تعارضٍ في دمجِ main إلى فرعِ F7-02 أخذَ نسخةَ الملفِّ
      # السابقةَ لـF7-07 — فبقيَ ADR 0068 يقولُ ما لا يفعلُه CI. أُعيدَت هنا،
      # وحاجزُ `scripts/check-migration-applier.ts` يمنعُ عودةَ العيبِ صامتاً.
      - name: تطبيق الهجرات بالمُطبِّقِ الآمنِ
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/migrate.ts

      # `REQUIRE_REAL_REDIS=1` يجعل غيابَ النقطةِ **إخفاقاً** لا تخطّياً: وظيفةٌ وُجدت
      # لتُشغِّل على Redis حقيقيٍّ لا تُقرَأ خضراءَ وهي لم تُخاطِبه. والحاجزُ لم يُخفَّفْ
      # في `S-3` بحرفٍ؛ إنّما صارَ **شرطُه مُستوفى**: النقطةُ خادمٌ في الشغلةِ.
      #
      # والرمزُ ههنا ظاهرٌ عن قصدٍ لا سهواً: خادمٌ يُنشَأُ ويُهدَمُ مع الوظيفةِ، لا
      # يُخاطَبُ من خارجِ شبكتِها، ولا يحملُ بياناً. ودليلُ التشغيلِ ما زالَ يُكتَم
      # ويُراجَع بحاجزِه (`scripts/check-real-redis-proof.ts`) — والكتمُ حكمُ الحاجزِ
      # لا حُسنُ الظنِّ. وسرٌّ حقيقيٌّ لو دخلَ يوماً فموضعُ قراءتِه واحدٌ كما كانَ
      # (`tests/support/real-redis.ts`).
      - name: اختبارات الجلسات على Redis حقيقي
        env:
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: waslah-ci-real-redis
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
          REQUIRE_REAL_REDIS: "1"
          REAL_REDIS_PROOF_PATH: /tmp/real-redis-proof.json
        run: set -o pipefail; bun run test:real-redis 2>&1 | tee /tmp/real-redis-output.log

      - name: لا يُقرَأ زعمُ Redis حقيقيٍّ دليلاً (OPS-006 · ADR 0049)
        run: bun run scripts/check-real-redis-proof.ts /tmp/real-redis-proof.json

      # الدليلُ يُرفَع مُرفَقاً لا يُطبَع وحدَه: يُقرأ في ملفِّ الأدلّةِ بعددٍ من التشغيلِ
      # نفسِه. وهو خالٍ من النقطةِ والرمزِ بحكمِ الحاجزِ الذي سبقَه لا بحسنِ الظنّ.
      - name: رفع دليل التشغيل الحقيقي
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-redis-proof
          path: /tmp/real-redis-proof.json
          if-no-files-found: warn

      # F9-05: بصمةُ التشغيلِ للـRedis الحقيقي.
      - name: بصمةُ التشغيل — كتابة (real-redis) (F9-05)
        if: always()
        env:
          JOB_NAME: real-redis
          CI_VERDICT: ${{ job.status }}
          REDIS_URL: http://localhost:8079
        run: |
          mkdir -p /tmp/run-manifests
          bun run scripts/emit-run-manifest.ts /tmp/run-manifests/real-redis.json

      # F9-05: الحاجزُ الساكن.
      - name: بصمةُ التشغيل — حاجز (real-redis) (F9-05)
        if: always()
        env:
          RUN_MANIFEST_DIR: /tmp/run-manifests
          JOB_NAME: real-redis
        run: bun run scripts/check-run-manifest.ts

  # ── F5-06 / SCL-008: برهانُ البنيةِ متعدّدِ المثيلاتِ في CI ──────────────────
  #
  # لا بديلَ سحابيٌّ مدفوعٌ متاحٌ، فالثابتُ يُثبَتُ هنا: ٣ بوّاباتٍ خلفَ موزّعٍ يفحصُ
  # `/ready`، والحالةُ في DB+Redis لا في ذاكرةِ البوّابة، وقتلُ نسخةٍ أثناءَ رحلةٍ
  # جاريةٍ لا يُفقدُ الخطوة. والبوّابةُ تعملُ بـ`TELEGRAM_TRANSPORT=silent` (seamٌ
  # مُعتمَدٌ) و`NODE_ENV=test` — الوضعُ غيرُ الإنتاجيِّ يرخي إجراءاتِ الإقلاعِ فقط،
  # وintake موصولٌ دائمًا فسلوكُ التشغيلِ واحدٌ. لا يُقلبُ هذا البندُ إلى `[x]`:
  # البرهانُ آليٌّ لا إنتاجيٌّ، و«مُثبَت» تتطلّبُ بيئةً شبيهةً بالإنتاج (`ح-5`).
  # وظيفةٌ منفصلةٌ بطلبِ `check-performance-budget.ts` نفسِه: «فحصٌ حتميٌّ من مُخرَجِ
  # البناءِ لا يُخلَطُ بقياسٍ مُتقلِّبٍ». ووُلِدَت من عطبٍ لا من ترفٍ (`D-25`): مُخرَجُ
  # `main`@`571c891` بُنيَ أخضرَ ومرَّ كلُّ حاجزٍ وكانَ يُفتَحُ **شاشةً بيضاءَ** — لأنَّ
  # لا متصفّحَ في CI يفتحُه. والمتصفّحُ `google-chrome` من صورةِ المُنفِّذِ لا تبعيّةٌ
  # جديدةٌ، وغيابُه إخفاقٌ لا تخطٍّ (ADR 0183).
  browser-first-paint:
    name: متصفّحٌ حقيقيٌّ — أوّلُ رسمٍ (F1-09 · D-25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: بناء تطبيق تِلِغرام المصغَّر
        run: bun run build:miniapp

      - name: التطبيقُ يرسمُ، وخرقا FCP/LCP محصوران بـDEC-19 (F1-09 · D-25 · ADR 0183)
        run: bun run scripts/measure-first-paint.ts

      - name: حَكَمُ أوّلِ الرسمِ وإطلاقُ مُعيِّناتِ المدخلِ — سوالبُ مزروعة
        run: bun test tests/unit/first-paint-budget.test.ts tests/unit/inline-entry-script.test.ts

  # ── F1-09 الصفُّ ٥ · D-26: وقتُ التفاعلِ بعدَ فتحِ تيليجرام ───────────────────────
  #
  # وظيفةٌ منفصلةٌ عن `browser-first-paint` لأنَّ الصفَّ ٥ يَقطَعُ مسارَ الإقلاعِ كاملَه:
  # `initData` مُوقَّعٌ + بوّابةٌ حقيقيّةٌ + `POST /v1/session/telegram` + `GET /v1/me` +
  # تحميلُ السطحِ. فلا يُخلَطُ بقياسِ الرسمِ وحدِه (الصفَّينِ ٣ و٤).
  #
  # والبوّابةُ نسخةٌ واحدةٌ في الذاكرةِ (لا Redis) — وهذا حدُّ الإنتاجِ اليومَ (`DEC-14`).
  # والقاعدةُ `PostgreSQL` حقيقيّةٌ بها الهجراتُ — `GET /v1/me` يقرأُ `users`. و`initData`
  # يُولَّدُ ببروتوكولِ تيليجرامَ الرسميِّ (`HMAC-SHA256`) فلا اتصالَ بتيليجرامَ.
  browser-tti:
    name: متصفّحٌ حقيقيٌّ — سطحُ الراكبِ على Slow 4G وحارسُ 3G (F1-09 الصفوفُ 3–5 · DEC-19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      - name: تطبيق الهجرات بالمُطبِّقِ الآمنِ
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/migrate.ts

      - name: بناء تطبيق تِلِغرام المصغَّر
        run: bun run build:miniapp

      - name: وقتُ التفاعلِ بعدَ فتحِ تيليجرام — مسارُ إقلاعٍ كاملٌ (F1-09 الصفُّ ٥ · D-26)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/measure-tti.ts

      - name: حَكَمُ وقتِ التفاعلِ وتوليدُ initData — سوالبُ مزروعة
        run: bun test tests/unit/interactive-budget.test.ts tests/unit/telegram-test-init-data.test.ts

  chaos-multi-instance:
    name: فوضى متعدد المثيلات (F5-06)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # لا `--wait`: البوّاباتُ **يجبُ** أن ترفضَ الإقلاعَ اليومَ (ADR 0050 §٣-ب)،
      # فانتظارُ صحّتِها انتظارُ ما لا يجوزُ حدوثُه. والحكمُ في الخطوةِ التاليةِ.
      - name: رفعُ رصةِ Docker Compose
        run: docker compose -f docker-compose.f5-06.yml up -d --build

      # القياسُ المشروعُ اليومَ: أنَّ كسرَ شرطِ النسخةِ الواحدةِ صاخبٌ في رصةٍ
      # حقيقيّةٍ من ثلاثِ حاوياتٍ — لا صامتٌ ولا مُتدهوِرٌ (R-17 · ADR 0050 §٣-ب).
      - name: برهانُ رفضِ الإقلاعِ متعدّدِ المثيلاتِ (R-17 · ADR 0050 §٣-ب)
        run: bun run scripts/f5-06-invariant-refusal.ts

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      # المُطبِّقُ نفسُه على قاعدةِ compose — لا طريقَ ثانٍ للهجراتِ في هذا المستودعِ
      # (F7-07 · ADR 0068). والمنفذُ 5433 هو ما تنشرُه رصةُ compose على العُدّاءِ.
      - name: تطبيق الهجرات بالمُطبِّقِ الآمنِ على قاعدةِ compose
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/waslah
        run: bun run scripts/migrate.ts

      # المنسّقُ يقرأُ آليةَ التوزيعِ المُقرَّرةَ من الشيفرةِ: يقودُ الرحلةَ إن كانت
      # تعبرُ حدودَ العمليةِ، ويُعلِنُ التعذُّرَ البنيويَّ صريحاً إن لم تكن — بلا
      # تعطيلِ حاجزٍ وبلا إعلانِ نجاحٍ لم يقع (ADR 0050 §٣-د · §٨-أ · REQ-07).
      - name: منسّقُ اختبارِ الفوضى — قيادةُ رحلةٍ عبرَ المثيلاتِ وقتلُ نسخةٍ أثناءَها
        run: bun run scripts/f5-06-chaos.ts

      - name: سجلاتُ البوّاباتِ عند الإخفاق
        if: failure()
        run: |
          docker compose -f docker-compose.f5-06.yml logs --no-color gateway-1 gateway-2 gateway-3 worker-1 worker-2 upstash-shim haproxy 2>&1 | tail -200

      - name: إزالةُ الرصة
        if: always()
        run: docker compose -f docker-compose.f5-06.yml down -v

      # F9-05: بصمةُ التشغيلِ للفوضى متعددِ المثيلات.
      - name: بصمةُ التشغيل — كتابة (chaos-multi-instance) (F9-05)
        if: always()
        env:
          JOB_NAME: chaos-multi-instance
          CI_VERDICT: ${{ job.status }}
        run: |
          mkdir -p /tmp/run-manifests
          bun run scripts/emit-run-manifest.ts /tmp/run-manifests/chaos-multi-instance.json

      # F9-05: الحاجزُ الساكن.
      - name: بصمةُ التشغيل — حاجز (chaos-multi-instance) (F9-05)
        if: always()
        env:
          RUN_MANIFEST_DIR: /tmp/run-manifests
          JOB_NAME: chaos-multi-instance
        run: bun run scripts/check-run-manifest.ts

  # ── F9-03 · OPS-004: مولّدُ حملٍ موزَّعٌ بمنسّقٍ عالميٍّ — برهانُ البنيةِ في CI ────
  #
  # البندُ يطلبُ مولّداتٍ في مضيفينَ منفصلينَ ومنسّقاً عالميّاً وبصمةَ إعداداتٍ مع
  # كلِّ تشغيلٍ. والمضيفونَ الفعليّونَ (≥٣ مناطقٍ) حاجزٌ خارجيٌّ (`REQ-06`) لا يُدَّعى
  # هنا — فالمُثبَتُ داخلَ المستودعِ هو البنيةُ: مولّداتٌ **عملياتُ نظامٍ منفصلةٌ**
  # لا تعرفُ الهدفَ ولا المنسّقَ إلا عبرَ HTTP (الدَّرزُ نفسُهُ الذي يفصلُها لو سكنتْ
  # مضيفاتٍ أخرى)، ومنسّقٌ عالميٌّ يفتحُ البوّابةَ بعدَ اكتمالِ العددِ ويُقسِّمُ الخطةَ
  # تقسيماً حتميّاً ويُصدرُ الحُكمَ، وخطةٌ مُبصَّمةٌ تُطابقُها كلُّ التقاريرِ. والسالبتانِ
  # المزروعتانِ تُثبتانِ أنّ المولّدَ الغائبَ أو المقتولَ وسطَ الجولةِ يُفشِلُ الجولةَ
  # باسمِهِ — لا خسارةَ صامتةَ في جولةِ قياسٍ. والهدفُ بوّابةٌ حقيقيّةٌ (حاويةُ المنتجِ)
  # على PostgreSQL حقيقيّةٍ لا خادمُ أرقامٍ.
  distributed-load:
    name: مولّد حمل موزَّع بمنسّق عالمي (F9-03)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      - name: تطبيق الهجرات بالمُطبِّقِ الآمنِ
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/migrate.ts

      # الجولةُ المكتملةُ: ٣ مولّداتٍ عملياتٍ منفصلةٍ عبرَ منسّقٍ عالميٍّ ضدَّ بوّابةٍ
      # حقيقيّةٍ — الحُكمُ بستِّ قواعدٍ (البلاغُ · البصمةُ · سلامةُ التقسيمِ · الوفاءُ
      # بالجدولةِ · صفرُ أخطاءِ النقلِ · سقفُ الانزلاقِ) وخروجُ السائقِ برمزِ الحُكمِ.
      - name: جولةٌ موزَّعةٌ مكتملةٌ — ٣ مولّداتٍ عبرَ منسّقٍ عالميٍّ (F9-03)
        env:
          BENCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: >
          bun run deferred/field-experiments/bench/distributed/run-distributed-load.ts
          --rate 30 --duration-ms 3000 --generators 3 --deadline-ms 25000

      # السالبةُ الأولى: مولّدٌ لا ينضمُّ أصلًا — بوّابةُ الانضمامِ لا تُفتحُ،
      # والمهلةُ النهائيّةُ تُصدرُ حُكمَ الفشلِ لا تعليقًا إلى الأبدِ.
      - name: سالبةٌ مزروعةٌ — مولّدٌ غائبٌ يُفشِلُ الجولةَ (F9-03)
        env:
          BENCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: >
          bun run deferred/field-experiments/bench/distributed/run-distributed-load.ts
          --rate 30 --duration-ms 2000 --generators 3 --deadline-ms 12000
          --negative missing-generator

      # السالبةُ الثانية: مولّدٌ يُقتَلُ (SIGKILL) وسطَ نافذةِ الإطلاقِ بعدَ أن
      # انضمَّ وجُدِّلَ لهُ — والآخرونَ يُبلِّغونَ، والغائبُ يُمسَكُ بفهرسِهِ.
      - name: سالبةٌ مزروعةٌ — مولّدٌ يُقتَلُ وسطَ الجولةِ (F9-03)
        env:
          BENCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: >
          bun run deferred/field-experiments/bench/distributed/run-distributed-load.ts
          --rate 30 --duration-ms 3000 --generators 3 --deadline-ms 15000
          --negative dead-mid-round

      # حَكَمُ الخطةِ الصرفةُ وسالباتُهُ المزروعةُ لكلِّ قاعدةٍ (تعملُ في verify أيضًا
      # ضمنَ bun test؛ تُكرَّر ههنا خطوةً مسمّاةً ليقرأَ الفاحصُ حكمَها في وظيفتِها).
      - name: حَكَمُ الخطةِ الصرفةُ — سوالبُ مزروعةٌ لكلِّ قاعدةٍ (F9-03)
        run: bun test tests/unit/bench-distributed-plan.test.ts

      # F9-05: بصمةُ التشغيلِ لمولّدِ الحملِ الموزَّعِ.
      - name: بصمةُ التشغيل — كتابة (distributed-load) (F9-05)
        if: always()
        env:
          JOB_NAME: distributed-load
          CI_VERDICT: ${{ job.status }}
        run: |
          mkdir -p /tmp/run-manifests
          bun run scripts/emit-run-manifest.ts /tmp/run-manifests/distributed-load.json

      # F9-05: الحاجزُ الساكن.
      - name: بصمةُ التشغيل — حاجز (distributed-load) (F9-05)
        if: always()
        env:
          RUN_MANIFEST_DIR: /tmp/run-manifests
          JOB_NAME: distributed-load
        run: bun run scripts/check-run-manifest.ts
