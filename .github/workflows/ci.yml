      # `F7-08` · `CAP-011`: عطبُ لوحةِ الإدارةِ **لا يُخفِقُ — يُعرَضُ رقماً**. فلو
      # انقطعَ شوطُ التجميعِ أسبوعاً لَبقيَت الشاشةُ تعملُ وتعرضُ أرقامَ الأسبوعِ
      # الماضي بلا أنّةٍ؛ ولو كُتِبَت نافذةُ الكاتبِ ٢٤ ونافذةُ القارئِ ١٢ لَبقيَت
      # الشاشةُ **فارغةً أبداً** بلا سطرِ خطأٍ؛ ولو صارَ «لا صفَّ لهذه المدينةِ»
      # صفراً لَقُرِئَ «لا نشاطَ» فيُتَّخَذُ قرارٌ على عَدَمٍ. وثلاثتُها تمرُّ في
      # `tsc` وفي المُدقِّقِ وفي كلِّ اختبارٍ لا يعرفُ أنَّه يجبُ أن يسألَ.
      # فالحاجزُ يقيسُ سبعَ قواعدَ: لا رقمَ منشوراً بلا وَسمِ عمرِه، ولا ساعةَ في
      # النطاقِ، ونافذةً بمصدرٍ واحدٍ بينَ الكاتبِ والقارئِ، وجدولاً مُسجَّلاً في
      # القوائمِ المغلقةِ الأربعِ، وكادةً في `JOB_INTERVALS` وحدَها لا في
