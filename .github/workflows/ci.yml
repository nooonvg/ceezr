name: CI

# `feat/**` مُضافة عن قصد: سياسةُ العمل تُلزم بالتحقّق من نجاح CI **بعد كل دفعة**
# لا آخرَ العمل، وكان الزنادُ على `main` وحدها فكانت الدفعاتُ على فرع العمل تمرّ
# بلا فحصٍ بعيدٍ إطلاقاً — فيتراكم عملٌ يُظنّ محقَّقاً ثم يُكتشف إخفاقه كلّه دفعةً
# واحدة عند فتح طلب الدمج.
#
# `workflow_dispatch` مُضافٌ لسببٍ واحدٍ مُقيسٍ (D-09 · ADR 0142): سيرُ مزامنةِ
# `bun.lock` على فروعِ Dependabot يدفعُ القفلَ بـ`GITHUB_TOKEN`، ودفعةُ ذلكَ الرمزِ
# **لا تُشعِلُ `push` ولا `pull_request`** بسياسةِ المنصّةِ لمنعِ الحلقاتِ — فلولا
# مدخلٌ يُستدعى صراحةً لبقيَ رأسُ الفرعِ الجديدُ بلا حكمِ CI، وهو ما تمنعُه القاعدةُ
# `0-7`. **ولا يُخفِّفُ هذا المدخلُ شيئاً**: الوظائفُ والخطواتُ والحواجزُ هيَ عينُها
# في كلِّ زنادٍ.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # سقفُ زمنٍ لكلِّ وظيفةٍ: التعليقُ الصامتُ أسوأُ من الأحمرِ، إذ الأحمرُ يقولُ
    # أينَ. وقد علَّقَت وظيفةُ التكاملِ ساعةً في `F3-07` على وعدٍ لا يُحسَمُ حتّى
    # قِيسَ بالمهلةِ قسراً (`ADR 0122`). والسقفُ أضعافُ أطولِ تشغيلٍ مقيسٍ، فلا
    # يُسقِطُ صحيحاً بطيئاً ولا يُبقي معطوباً معلَّقاً إلى حدِّ المنصّةِ.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: بناء تطبيق تِلِغرام المصغَّر
        run: bun run build:miniapp

      - name: Test
        run: set -o pipefail; bun run test 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      - name: منع الكود الوهمي في الملفات المنفّذة
        run: |
          if grep -rn "In production this would" --include="*.ts" .; then
            echo "::error::تعليق كود وهمي ممنوع (القاعدة 0.1)"
            exit 1
          fi

      - name: منع الأرقام التجارية المرمَّزة داخل الكود
        run: bun run scripts/check-business-constants.ts

      - name: منع استيراد infrastructure داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*infrastructure" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يستورد من infrastructure إطلاقاً (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد application داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*application" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يعتمد على application (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد مزدوجات الاختبار في كود الإنتاج
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*tests/" \
               --include="*.ts" packages apps; then
            echo "::error::ممنوع استيراد أي شيء من tests/ داخل packages أو apps (القاعدة 0.1)"
            exit 1
          fi

      # خطّةُ هجرةٍ تسكنُ وثيقةً وحدَها تتقادمُ بلا سطرٍ خاطئٍ: تُبدَّلُ وجهةُ جدولٍ
      # في الجردِ فتبقى خطّتُه على الوجهةِ القديمةِ، فيقرأُ منفِّذٌ خطّةً صحيحةَ
      # الشكلِ تُخالِفُ القرارَ النافذَ. ويُخفِقُ الحاجزُ كذلكَ على أيِّ مُدخلٍ
      # يدّعي تنفيذاً وقسمُ «Migrated» في ROADMAP.md خالٍ. (ADR 0083)
      #
      # ويقعُ **قبلَ** حاجزِ القاعدةِ 0.4 عن قصدٍ: ذاكَ أحمرُ اليومَ بقرارِ مالكٍ
      # لم يُحسَم (`O-1`)، والوظيفةُ تنقطعُ عندَه، فخطوةٌ بعدَه لا تُشغَّلُ قطُّ
      # ولا يُقرأُ لها حكمٌ. وحاجزٌ لا يُقاسُ حاجزٌ يُظَنُّ أنَّه يحرسُ. ولا يُضعَّفُ
      # بذلكَ حاجزُ 0.4 ولا يُؤخَّرُ: هوَ الخطوةُ التاليةُ ويُخفِقُ كما كانَ.
      - name: مصفوفةُ الهجرةِ شاملةٌ ومتماسكةٌ ولا تدّعي تنفيذاً (W-2 / ADR 0083)
        run: bun run scripts/check-migration-matrix.ts

      # حدُّ الصادرِ: كلُّ مقصدٍ شبكيٍّ مُعلَنٌ، ولا مقصدَ في MARKET، ولا مرورَ
      # بينَ الأنظمةِ إلّا عبرَ بابِ CORE، ولا ادّعاءَ إزالةٍ بلا إزالةٍ. (ADR 0084)
      #
      # وموضعُه **قبلَ** حاجزِ القاعدةِ 0.4 لعينِ السببِ المذكورِ أعلاه.
      - name: حدُّ الصادرِ مُعلَنٌ بالكاملِ ولا مقصدَ في MARKET (W-6 / ADR 0084)
        run: bun run scripts/check-egress-boundary.ts

      # وموضعُ هذه الخطوةِ **قبلَ** حاجزِ `city_id` مقصودٌ للسببِ عينِه، وقد قِيسَ
      # مرّتَينِ: خطوةٌ بعدَ الحمراءِ تُقرَأُ `skipped` فلا حكمَ لها ألبتّةَ.
      - name: التشغيلُ الجافُّ لا يستطيعُ الكتابةَ ولا التسويةُ تدّعي أخضرَ (W-8 / ADR 0085)
        run: bun run scripts/check-migration-dry-run.ts

      # وهذه أيضاً **قبلَ** الحمراءِ، للسببِ عينِه المقيسِ ثلاثَ مرّاتٍ.
      - name: سجلُّ الحواجزِ مقروءٌ من مصدرٍ واحدٍ ولا إشهادَ يُلفَّقُ (W-8 · ADR 0087)
        run: bun run scripts/check-blocker-registry.ts

      # وهذه أيضاً **قبلَ** الحمراءِ، للسببِ المقيسِ عينِه.
      - name: سجلُّ التحوُّلِ لكلِّ خطوةٍ عكسٌ ومِسبارُ قراءةٍ، والتمرينُ مرفوضٌ بالإنشاءِ (W-9 · ADR 0088)
        run: bun run scripts/check-cutover-plan.ts

      # وهذه كذلكَ **قبلَ** الحمراءِ، وللسببِ عينِه: كلُّ ما بعدَ خطوةِ `city_id`
      # لا يُنفَّذُ ألبتّةَ ما بقيَت `O-1` مفتوحةً، فحاجزٌ يُوضَعُ بعدَها حاجزٌ
      # لا حكمَ له. والمقيسُ ههنا سندُ العقودِ المنقولةِ (`DEP-CORE-005`): لا
      # يقرأُ شبكةً ولا سرّاً، فلا عذرَ لتأخيرِه.
      - name: سندُ العقودِ المنقولةِ مُفكَّكٌ — لا ملفَّ بلا مصدرٍ ولا سندَ لمعدومٍ (DEP-CORE-005)
        run: bun run scripts/check-vendored-contract-pins.ts

      - name: سقوطُ مُقابِلِ الطزاجةِ مقيسٌ بخرقٍ مزروعٍ لا بنسخةٍ من CORE (DEP-CORE-005)
        run: bun test tests/unit/vendored-contract-pins.test.ts tests/unit/core-contract-freshness.test.ts

      - name: سقوطُ حاجزِ «السندُ يتبعُ البايتاتَ» مقيسٌ بمستودَعٍ مزروعٍ (DEP-CORE-005)
        run: bun test tests/unit/vendored-pin-follows-bytes.test.ts

      # وهذه كذلكَ **قبلَ** الحمراءِ، وللسببِ المقيسِ عينِه. والمقيسُ ههنا سجلُّ
      # وثائقِ الموافقةِ (`F2-01`): لا يقرأُ شبكةً ولا قاعدةً ولا سرّاً، بل نصَّ
      # الهجرةِ وقواميسَ اللغاتِ الثلاثِ، فلا عذرَ لتأخيرِه خلفَ `O-1`.
      - name: أصنافُ الموافقةِ مطابقةٌ لقيدِ الهجرةِ ولكلِّ مفتاحٍ ثلاثُ لغاتٍ (F2-01)
        run: bun run scripts/check-consent-documents.ts

      - name: سقوطُ حاجزِ وثائقِ الموافقةِ مقيسٌ بافتراقٍ مزروعٍ لا بالمستودَعِ كما هوَ (F2-01)
        run: bun test tests/unit/check-consent-documents.test.ts

      # ومثلُها لأنواعِ المكانِ المحفوظِ (`F2-02`): نصُّ الهجرةِ وشرطُ الفهرسِ
      # الفريدِ وقواميسُ اللغاتِ الثلاثِ، بلا شبكةٍ ولا قاعدةٍ ولا سرٍّ.
      - name: أنواعُ المكانِ مطابقةٌ لقيدِ الهجرةِ ولشرطِ الفهرسِ الفريدِ (F2-02)
        run: bun run scripts/check-place-kinds.ts

      - name: سقوطُ حاجزِ أنواعِ المكانِ مقيسٌ بافتراقٍ مزروعٍ لا بالمستودَعِ كما هوَ (F2-02)
        run: bun test tests/unit/check-place-kinds.test.ts

      # ومثلُها لعقدِ الوجهةِ (`F2-03`) — وهذا أوسعُها: يُطابِقُ جدولَ طيِّ الحروفِ
      # وصنفَ المحارفِ في **النطاقِ** بوسيطَي `translate` ونصِّ `regexp_replace`
      # في الهجرةِ حرفاً بحرفٍ، ورموزَ الرفضِ بما تُعيدُه الدالّةُ فعلاً، ووجودَ
      # الفهارسِ الثلاثةِ في طورِ `index` بـ`concurrently`.
      #
      # ولا يُغني عن `tests/integration/destinations.test.ts`: ذاكَ يُقارِنُ
      # **سلوكَينِ** على محرّكٍ حقيقيٍّ، وهذا يُقارِنُ نصَّينِ — وجدولانِ
      # متطابقانِ نصّاً قد يُنفَّذانِ مختلفَينِ. فالبوّابتانِ قائمتانِ معاً ولا
      # تُقرَأُ إحداهما إثباتاً للأخرى.
      - name: عقدُ الوجهةِ — تطبيعٌ واحدٌ في الزمنَينِ وأصنافٌ ورفوضٌ وفهارسُ مطابقةٌ (F2-03)
        run: bun run scripts/check-destination-contract.ts

      - name: سقوطُ حاجزِ عقدِ الوجهةِ مقيسٌ بافتراقٍ مزروعٍ لا بالمستودَعِ كما هوَ (F2-03)
        run: bun test tests/unit/check-destination-contract.test.ts

      # `F2-04`: حاجزُ عقدِ الاقتباسِ يُنفِذُ ما لا يُنفِذُه مُراجِعٌ بعينِه — أنَّ
      # **لا لفظَ أجرةٍ ولا وسيلةَ دفعٍ ولا حقلاً مُعَدّاً لهما** في شريحةِ
      # الاقتباسِ كلِّها (`ADR 0039` §٤ محجوبٌ على `DEC-11`، و`م13-7` يُجمِّدُ حتّى
      # الهياكلَ التمهيديّةَ)، وأنَّ رقمَ المسافةِ لا يُسافِرُ بلا وسمِه، وأنَّ كلَّ
      # رمزِ رفضٍ تُصدِرُه الهجرةُ مُترجَمٌ في الشاشةِ فلا يُعرَضُ رمزٌ يتيمٌ.
      # ولا يُغني عن `tests/integration/quote.test.ts`: ذاكَ يُقاسُ على محرّكٍ
      # حقيقيٍّ، وهذا نصٌّ ساكنٌ — والبوّابتانِ قائمتانِ معاً.
      - name: عقدُ الاقتباسِ — لا أجرةَ ولا دفعَ ولا رقمَ بلا وسمٍ ولا رمزَ يتيمٌ (F2-04)
        run: bun run scripts/check-quote-contract.ts

      - name: سقوطُ حاجزِ عقدِ الاقتباسِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ (F2-04)
        run: bun test tests/unit/check-quote-contract.test.ts

      # `F2-05`: طلبُ الرحلةِ. والحاجزُ يفرضُ عشرَ قواعدَ كانَت تُحرَسُ بالمراجعةِ
      # البشريّةِ وحدَها — أوّلُها أنَّ مفتاحَ التكرارِ **قيدُ مخطَّطٍ** لا فحصُ
      # تطبيقٍ: فحصٌ في الشِّفرةِ («اقرأْ ثمَّ اكتُبْ») يُنتِجُ رحلتَينِ عندَ
      # ضغطتَينِ متوازيتَينِ، والمهلةُ بينَ القراءةِ والكتابةِ هيَ البابُ. وأنَّ
      # مسارَ الشبكةِ لا يستوردُ الكاتبَ الأقدمَ بلا مفتاحٍ (`ARCH-006`)، وأنَّ
      # المؤقّتَ يُقاسُ من ميلادِ الرحلةِ لا من فتحِ الشاشةِ، وأنَّ صفرَ
      # المبلَّغينَ نصٌّ مُعلَنٌ لا رقمٌ في قالبٍ (`ADR 0023`).
      # ولا يُغني عن `tests/integration/ride-request.test.ts`: ذاكَ يُقاسُ على
      # PostgreSQL حقيقيٍّ بسباقٍ فعليٍّ، وهذا نصٌّ ساكنٌ — والبوّابتانِ معاً.
      - name: عقدُ طلبِ الرحلةِ — مفتاحُ تكرارٍ قيدَ مخطَّطٍ ولا حالةَ بحثٍ مُجمَّلةً (F2-05)
        run: bun run scripts/check-ride-request-contract.ts

      - name: سقوطُ حاجزِ عقدِ طلبِ الرحلةِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ (F2-05)
        run: bun test tests/unit/check-ride-request-contract.test.ts

      # `UX-021`: صنفٌ يُصدِرُه العرضُ بلا قاعدةٍ في ورقةِ النمطِ **لا يُخفِقُ في
      # بناءٍ ولا اختبارٍ ولا مُدقِّقٍ**: تُرسَمُ الشاشةُ بأنماطِ المتصفِّحِ
      # الافتراضيّةِ فيراها المستخدمُ عاريةً ويراها المُختبَرُ خضراءَ. وقد وقعَ
      # فعلاً في سطحَي `F2-02` و`F2-03`، وسببُ التكرارِ **غيابُ القياسِ** لا سهوُ
      # كاتبٍ. فالحاجزُ يقابلُ المُصدَرَ بالمُحدِّدِ في الاتجاهَينِ، ويمنعُ تعبيرَ
      # صنفٍ لا يُحَلُّ ساكناً كي لا يُخدَعَ القياسُ نفسُه (`ADR 0105`).
      - name: لا صنفَ يُصدِرُه العرضُ بلا قاعدةٍ ولا قاعدةَ بلا مُصدِرٍ غيرَ مُسجَّلةٍ (UX-021)
        run: bun run scripts/check-css-class-coverage.ts

      - name: سقوطُ حاجزِ تغطيةِ أصنافِ العرضِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ (UX-021)
        run: bun test tests/unit/check-css-class-coverage.test.ts

      # `OPS-019`: أخطرُ من اختبارٍ أحمرَ اختبارٌ **أخضرُ بشرطٍ لم يطلُبْه**. كانت
