      # طولَ طريقٍ وهوَ خطٌّ مستقيمٌ (`ADR 0024`)؛ وهويّةُ راكبٍ في حمولةِ عرضٍ
      # تُكشَفُ **لكلِّ سائقي الجولةِ** لا لمن ظفرَ بالطلبِ. وتُقاسُ معها أنَّ
      # الطبقةَ الماليّةَ غائبةٌ بإعلانٍ: لا لفظَ مالٍ في الشريحةِ كلِّها
      # (`ADR 0039` §4 · `DEC-11`)، فحقلٌ فارغٌ اسمُه أجرةٌ يُقرأُ «مجّاناً».
      - name: عقدُ عروضِ السائقِ — لا ساعةَ جهازٍ في حكمٍ ولا ذرّيّةَ ثانيةً ولا هويّةَ راكبٍ في عرضٍ (F3-02 · SD-03 · SD-04)
        run: bun run scripts/check-driver-offers-contract.ts

      - name: سقوطُ حاجزِ عروضِ السائقِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ من الثمانِ (F3-02 · ح-7)
        run: bun test tests/unit/check-driver-offers-contract.test.ts

      # ومَهمّةُ السائقِ النشطةُ شريحةٌ أخطرُ من العرضِ: العرضُ يُقبَلُ أو يُرفَضُ،
      # أمّا المَهمّةُ **فتُختَمُ أطوارُها** — ووصولٌ يُختَمُ بغيرِ فعلِ إنسانٍ
      # (باستنتاجِ قُربٍ) يُحاسِبُ الراكبَ على انتظارٍ لم يبدأْ، وذاكَ يمرُّ في كلِّ
      # اختبارٍ ببياناتٍ مُرتَّبةٍ (`ADR 0118`). ومعَه: كاتبٌ ثانٍ للانتقالِ يجعلُ
      # لبدءِ الرحلةِ كاتبَينِ فتنحرفُ الحالةُ عن سجلِّ التدقيقِ؛ وختمٌ لهُ كاتبانِ
      # يُكتَبُ مرّتَينِ فلا يُقرأُ منهُ أوّلُ وصولٍ؛ وشاشةٌ تُقارِنُ الحالةَ محلّيّاً
      # تُعيدُ بناءَ آلةِ الحالاتِ فتتقادَمُ عندَ أوّلِ طَورٍ يُزادُ؛ وهاتفُ الراكبِ
      # ليسَ من عقدِ هذا السطحِ ولو كانَ السائقُ صاحبَ الطلبِ.
      - name: عقدُ مَهمّةِ السائقِ — الطَورُ ختمُ إنسانٍ لا استنتاجُ قُربٍ، وكاتبٌ واحدٌ لكلِّ انتقالٍ (F3-03 · SD-05)
        run: bun run scripts/check-driver-job-contract.ts

      - name: سقوطُ حاجزِ مَهمّةِ السائقِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ من الثمانِ (F3-03 · ح-7)
        run: bun test tests/unit/check-driver-job-contract.test.ts

      # والنبضةُ الدوريّةُ أخطرُ من قراءةٍ بالطلبِ: قراءةٌ خاطئةٌ تُصلَحُ بتحديثِ
      # الشاشةِ، أمّا نبضةٌ بمُدّةٍ **مُخترَعةٍ في العميلِ** فتستنزفُ بطاريّةَ
      # سائقٍ يعملُ ساعاتٍ، وتُشبِعُ حدَّ المعدَّلِ فتُرفَضُ نبضاتٌ حقيقيّةٌ،
      # ولا يظهرُ ذلكَ في أيِّ اختبارٍ لأنَّ كلَّ نداءٍ ناجحٌ. ومعَه: غيابُ
      # إعدادٍ يُقرأُ صفراً فيصيرُ السكونُ بثّاً متّصلاً؛ وسببٌ يُشتَقُّ في
      # الشاشةِ بمقارنةِ حالةٍ فتصيرُ آلةُ الحالاتِ نسختَينِ؛ ومُرسِلٌ ثانٍ
      # يُضاعِفُ النبضَ ويُقاسِمُ حدَّ المعدَّلِ نفسَه.
      - name: عقدُ بثِّ موقعِ السائقِ — المُدّةُ حقيقةُ خادمٍ والغيابُ عَدَمٌ لا صفرٌ (F3-04 · SD-05)
        run: bun run scripts/check-location-broadcast-contract.ts

      - name: سقوطُ حاجزِ بثِّ الموقعِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ من الثمانِ (F3-04 · ح-7)
        run: bun test tests/unit/check-location-broadcast-contract.test.ts

      # شاشةُ أرقامٍ تُقرأُ على مُشتَغِلٍ أخطرُ من شاشةِ حالةٍ: حالةٌ خاطئةٌ تُرى
      # وتُشتكى، أمّا **نسبةٌ بلا مقامٍ** فتُقرأُ حُكماً نهائيّاً على رزقِ إنسانٍ
      # وهيَ عن عرضَينِ، ولا يسقُطُ بها اختبارٌ ألبتّةَ. ومعَها: مبلغٌ يُخترَعُ في
      # منصّةٍ لا تتوسّطُ في أجرةٍ فيُقرأُ وعداً؛ وصفرٌ يحلُّ محلَّ «لم يُقَسْ»
      # فيُحسَبُ حقيقةً؛ ونصٌّ يُوحي بأنَّ رفضاً يُنقِصُ ترتيباً والمعادلةُ لا
      # تقرأُه فيُخيفُ ويكسِبُ؛ وهويّةُ راكبٍ تسرُّبُ في أرشيفٍ لا يحتاجُها.
      - name: عقدُ حصيلةِ السائقِ — المقامُ يُنشَرُ دائماً والغيابُ مُعلَنٌ بأساسِه (F3-05 · SD-06 · SD-09)
        run: bun run scripts/check-driver-activity-contract.ts

      - name: سقوطُ حاجزِ الحصيلةِ مقيسٌ بافتراقٍ مزروعٍ لكلِّ قاعدةٍ من التسعِ (F3-05 · ح-7)
        run: bun test tests/unit/check-driver-activity-contract.test.ts

      # عطبٌ دُفِعَ ثمنُه **أربعَ مرّاتٍ**: في `$1::jsonb` يستنبِطُ PostgreSQL
      # نوعَ المُعامِلِ `jsonb` فيُرمِّزُ السائقُ القيمةَ **مرّتَينِ**، فيصلُ
      # الرقمُ نصّاً بلا خطأٍ ولا سجلٍّ. مرّةً أرسلَ بثّاً إلى الجمهورِ كلِّه
      # إذ قُرِئَت المرشِّحاتُ `null`، ومرّةً أسقطَ خمسةَ عشرَ اختباراً في
      # ملفّاتٍ لا علاقةَ لها بالبندِ (`F2-09`). والدرسُ كانَ مكتوباً في
      # ثلاثةِ تعليقاتٍ ولم يكن مُنفَذاً آلةً — فصارَ.
      - name: لا مُعامِلَ مربوطاً بـ`::jsonb` — القيمةُ تُرمَّزُ مرّةً واحدةً
        run: bun run scripts/check-jsonb-binding.ts

      - name: سقوطُ حاجزِ `jsonb` مقيسٌ بسالبةٍ مزروعةٍ — منها السطرُ الذي أسقطَ CI (ح-7)
        run: bun test tests/unit/check-jsonb-binding.test.ts

      # عطبٌ من الصنفِ نفسِه في الاتّجاهِ المعاكسِ: عمودُ `date` في عقدِ خرجِ
      # دالّةٍ يصلُ العميلَ كائنَ `Date` عندَ منتصفِ ليلِ UTC، فيقرأُه محوِّلٌ
      # عقدُه `string | null` **عَدَماً** بلا خطأٍ ولا سجلٍّ. وقد أخفى ذلكَ في
      # `F3-07` تواريخَ انتهاءِ رخصةِ السيرِ والتأمينِ والفحصِ عن السائقِ — وهيَ
      # الحقيقةُ التي تحجُبُه عن العملِ (`ADR 0115`) — ولم يُكشَف إلّا بسقوطِ
      # اختبارِ تكاملٍ في CI. فصارَ الدرسُ حاجزاً لا تعليقاً (`ADR 0121`).
      - name: لا عمودَ `date` في عقدِ خرجٍ — التاريخُ المجرَّدُ يعبرُ الحدَّ نصّاً (ADR 0121)
        run: bun run scripts/check-date-only-boundary.ts

      - name: سقوطُ حاجزِ الحدِّ مقيسٌ بعقدٍ مزروعٍ — منه العقدُ الذي أسقطَ CI (ح-7)
        run: bun test tests/unit/check-date-only-boundary.test.ts

      # وأخطرُ من الأحمرِ: **التعليقُ الصامتُ**. وسمُ استعلامِ `postgres.js`
      # مُرجَأٌ لا وعدٌ منطلقٌ — لا يُرسَلُ حتّى يُنادى `then` — ومُطابِقُ
      # `expect(…).rejects` لا يُناديه. فحالتانِ في اختبارِ تكاملِ `F3-07`
      # مرَّرَتا الوسمَ خامّاً، فعلَّقَتا وظيفةَ «تكامل على PostgreSQL حقيقي»
      # أكثرَ من ساعةٍ **بلا رسالةِ فشلٍ ولا سطرٍ في السجلِّ**؛ والأحمرُ يقولُ
      # أينَ، والتعليقُ لا يقولُ شيئاً. فصارَ الدرسُ حاجزاً (`ADR 0122`).
      - name: لا وسمَ استعلامٍ مُرجَأً داخلَ `expect(…)` — فلا وعدَ بلا حسمٍ (ADR 0122)
        run: bun run scripts/check-lazy-query-assertion.ts

      - name: سقوطُ حاجزِ الإرجاءِ مقيسٌ بسالبةٍ مزروعةٍ — منها الحالةُ التي علَّقَت CI (ح-7)
        run: bun test tests/unit/check-lazy-query-assertion.test.ts

      # وأمكرُ من الأحمرِ الثابتِ: **الأحمرُ المتقطّعُ**. الرقمُ في قناةِ
      # التتبُّعِ يُمنَحُ داخلَ معاملةٍ ويُنشَرُ بعدَها بلا قفلٍ، فمن نداءَينِ
      # متزامنَينِ قد ينشرُ صاحبُ ٣ قبلَ صاحبِ ٢ — وذلكَ صحيحٌ بنصِّ `ADR 0053`.
      # فتوكيدٌ يقولُ «آخرُ ما نُشِرَ = last_sequence» يقيسُ الجدولةَ لا العقدَ:
      # أسقطَ CI ثلاثَ مرّاتٍ من ملفٍّ واحدٍ (`OPS-016` · `OPS-017` · التشغيلُ
      # 35431980350)، وأُصلِحَ مرّتَينِ بيدٍ فعادَ في سطرٍ ثالثٍ. والأحمرُ
      # المتقطّعُ يُعلِّمُ إعادةَ التشغيلِ بدلَ القراءةِ، فصارَ حاجزاً (`ADR 0147`).
      - name: لا شاهدَ يقرأُ ترتيبَ التسليمِ في اختبارٍ متزامنٍ (ADR 0147)
        run: bun run scripts/check-sequence-witness-order.ts

      - name: سقوطُ حاجزِ شاهدِ الترتيبِ مقيسٌ بسالباتٍ مزروعةٍ — منها الأسطرُ التي أسقطَت CI (ح-7)
        run: bun test tests/unit/check-sequence-witness-order.test.ts

      # وأخفى من التعليقِ: **فحصٌ يمرُّ نهاراً ويسقطُ ليلاً**. نافذةُ التقاريرِ
      # تبدأُ عندَ منتصفِ ليلِ المدينةِ، فاختبارٌ ثبَّتَ `city_timezone` حرفاً
      # وزرعَ صفّاً «قبلَ ساعتَينِ» يقيسُ ساعةَ الحائطِ لا الدالّةَ: سقطَ فحصانِ
      # في `F3-07` عندَ ٢١:١٨Z (٠٠:١٨ بالرياضِ) بلا تغيُّرِ منتَجٍ — والتخفيفُ
      # ههنا كذبٌ، فصارَ الحدُّ يُثبَّتُ حساباً (`ADR 0123`).
      - name: لا منطقةَ زمنٍ مُثبَّتةً بحرفٍ في اختبارٍ يقرأُ نافذةً محليّةً (ADR 0123)
        run: bun run scripts/check-wall-clock-window-tests.ts

      - name: سقوطُ حاجزِ النافذةِ مقيسٌ بسالبةٍ مزروعةٍ — منها السطرُ الذي أسقطَ CI (ح-7)
        run: bun test tests/unit/check-wall-clock-window-tests.test.ts

      # وأخبثُ من ذاكَ: **حاجزٌ يقيسُ جارَ المُنفِّذِ لا شِفرتَنا**. توكيدُ نسبةِ
      # الزمنِ في اختبارِ الصمودِ قرأَ ٣٫٢ في التشغيلِ `35124024068` ثمَّ مرَّ
      # بإعادةِ التشغيلِ **بالبصمةِ عينِها** — إنذارٌ على ضجيجٍ، ومعَهُ صمتٌ محتمَلٌ
      # عن نموٍّ حقيقيٍّ يختفي تحتَه. فبُدِّلَت **وحدةُ القياسِ** لا العتبةُ
      # (`DEC-18` · `ADR 0130`): صفوفٌ ممسوحةٌ وكُتَلٌ ملموسةٌ من `pg_stat_database`،
      # والسقفُ ×٣ كما كانَ — ورفعُه مسارٌ محظورٌ يُنفِذُهُ هذا الحاجزُ لا المراجعةُ.
      - name: تدهورُ الصمودِ مقيسٌ بعملِ المحرِّكِ لا بزمنِ الساعةِ (DEC-18 · ADR 0130)
        run: bun run scripts/check-soak-work-measure.ts

      - name: سقوطُ حاجزِ قياسِ التدهورِ مقيسٌ بسالبةٍ لكلِّ قاعدةٍ من الستِّ (ح-7)
        run: bun test tests/unit/check-soak-work-measure.test.ts

      # `F9-06` · `OPS-005`: ميزانيةُ عملٍ مطلقةٌ للكتلةِ الدافئةِ الأولى —
      # سقفٌ مقيسٌ يكشفُ الانحدارَ الثابتَ الذي لا تُمسكُهُ نسبةُ `DEC-18`.
      # الانحدارُ الذي يضاعفُ العملَ في الكتلتَينِ معاً يمرُّ أصفاراً في النسبةِ.
      - name: ميزانيةُ العملِ المطلقةِ للانحدارِ الأدائيِّ (F9-06 · OPS-005)
        run: bun run scripts/check-work-budget.ts

      - name: سقوطُ حاجزِ ميزانيّةِ العملِ مقيسٌ بسالبةٍ لكلِّ قاعدةٍ (ح-7)
        run: bun test tests/unit/check-work-budget.test.ts

      # `F1-09` · القسمُ 9.9 الصفُّ السابعُ: حدُّ بياناتِ جلسةِ راكبٍ في عشرِ دقائقَ
      # كانَ عهداً مكتوباً لا يفحصُه شيءٌ. وهذا الحاجزُ ساكنٌ يحرسُ **بقاءَ القياسِ**
      # ووحدةَ مصدرِه ومطابقتَه لصفِّ العقدِ — لا صحّةَ نتيجتِه: النتيجةُ تُقاسُ في
      # وظيفةِ التكاملِ على بوّابةٍ وقاعدةٍ وقناةٍ حقيقيّةٍ.
      - name: حدُّ بياناتِ جلسةِ الراكبِ محروسٌ في مصدرٍ واحدٍ (F1-09)
        run: bun run scripts/check-session-data-budget.ts

      - name: سقوطُ حاجزِ حدِّ بياناتِ الجلسةِ مقيسٌ بسالبةٍ لكلِّ قاعدةٍ (ح-7)
        run: bun test tests/unit/check-session-data-budget.test.ts

      - name: حكمُ بياناتِ الجلسةِ مبرهَنُ السقوطِ قاعدةً قاعدةً (F1-09 · ح-7)
        run: bun test tests/unit/session-data-budget.test.ts

      # `SEC-15` (الشقُّ المملوكُ للمستودَعِ من `F8-08`): `Dependabot` يُخبِرُ ولا
      # يمنعُ — طلبٌ مفتوحٌ بلا مراجعٍ لا يُسقِطُ بناءً. وهذا الحاجزُ يُشغِّلُ
      # `bun audit` ويُسقِطُ البناءَ على نشرةٍ عندَ حدِّ الشدّةِ بلا إقرارٍ حيٍّ،
      # **ويسقطُ مغلقاً** متى تعذَّرَ القياسُ — فالعجزُ عن القياسِ عطبٌ لا أخضرُ.
      - name: لا تبعيّةَ بنشرةِ ثغرةٍ عندَ الحدِّ بلا إقرارٍ حيٍّ (SEC-15)
        run: bun run scripts/check-dependency-advisories.ts

      - name: سقوطُ حاجزِ نشراتِ الثغراتِ مقيسٌ بسالبةٍ لكلِّ قاعدةٍ (ح-7)
        run: bun test tests/unit/check-dependency-advisories.test.ts

      - name: حكمُ نشراتِ الثغراتِ مبرهَنُ السقوطِ قاعدةً قاعدةً (SEC-15 · ح-7)
        run: bun test tests/unit/dependency-advisory-registry.test.ts

      # `ECO-002` (الشقُّ المملوكُ للمستودَعِ من القسمِ 17): «عددُ نداءاتِ مزوّدِ
      # التوجيهِ لكلِّ رحلةٍ» كانَ عهداً بلا رقمٍ، وحاجزُ `CAP-012` يقولُ في وثيقتِه
      # إنَّه «لا يُثبِتُ أنَّ التخزينَ يعملُ». وهذا الحاجزُ يحرسُ **بقاءَ العدِّ**:
      # ملفَّ قياسٍ يعدُّ طلباتِ `HTTP` على منفذٍ حقيقيٍّ من حاويةٍ إنتاجيّةٍ،
      # وسقفاً مُشتَقّاً من شكلِ النافذةِ لا مكتوباً رقماً يُرفَعُ عندَ الضيقِ.
      # والعددُ وحدَه محروسٌ: السعرُ في فاتورةِ مزوّدٍ (`REQ-09` · `[!]`).
      - name: عددُ نداءاتِ التوجيهِ لكلِّ رحلةٍ معدودٌ لا مُقدَّرٌ (ECO-002)
        run: bun run scripts/check-routing-call-budget.ts

      - name: سقوطُ حاجزِ عدِّ النداءاتِ مقيسٌ بسالبةٍ لكلِّ قاعدةٍ (ح-7)
        run: bun test tests/unit/check-routing-call-budget.test.ts

      - name: حكمُ ميزانِ النداءاتِ مبرهَنُ السقوطِ قاعدةً قاعدةً (ECO-002 · ح-7)
        run: bun test tests/unit/routing-call-budget.test.ts

      # `ECO-003` (الشقُّ المملوكُ للمستودَعِ من القسمِ 17): «عددُ الرسائلِ الحرجةِ
      # لكلِّ رحلةٍ». والرسالةُ الحرجةُ ههنا **رسالةُ دفعٍ** — تُرسَلُ إلى طرفٍ لم
      # يُرسِل التحديثَ المُوجِبَ لها: تلكَ وحدَها تتوسَّعُ بعددِ السائقينَ وتصطدمُ
