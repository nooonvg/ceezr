      # حيّاً مُعلَناً محروساً بإذنٍ. ولا يُغني عن
      # `tests/integration/admin-metric-snapshots.test.ts`: ذاكَ يقيسُ على
      # PostgreSQL حقيقيٍّ صفّاً لكلِّ مدينةٍ وإعادةَ تنفيذٍ وزمناً من ساعةِ
      # القاعدةِ — وهذا نصٌّ ساكنٌ، والبوّابتانِ معاً (`ADR 0128`).
      - name: عقدُ تجميعاتِ الإدارةِ — لا رقمَ بلا عمرِه ولا نافذتَينِ ولا كادةً في مكانَينِ (F7-08)
        run: bun run scripts/check-admin-metric-snapshot-contract.ts

