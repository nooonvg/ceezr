name: إبقاءُ البوّابةِ مستيقظةً على Render المجانيّة

# لماذا: البوّابةُ التجريبيّةُ `waslah-gateway` على خطّةِ Render `free` (والمانيفستُ يُعلِنُ
# `free` أيضاً منذ تصحيحِه — كانَ يُعلِنُ `starter`)، والخطّةُ المجانيّةُ تُنيمُ الخدمةَ بعدَ 15 دقيقةً بلا حركةٍ واردة. ولأنَّ
# `RUN_WORKER_IN_GATEWAY=true` هناك فالمهامُّ الدوريّةُ كلُّها تنامُ معَها — تسليمُ الاستغاثاتِ
# وانتهاءُ العروضِ والاشتراكات. قِيسَ يومَ 2026-10-02 نومٌ من 14:27 إلى 15:32 UTC.
#
# ما ليسَ هذا: ليسَ بديلًا عن خطّةٍ مدفوعة (قرارُ كلفةٍ للمالك) ولا ضمانَ توفّرٍ — جدولةُ
# GitHub قد تتأخّرُ، فالفاصلُ 5 دقائقَ ليتّسعَ الهامشُ دونَ عتبةِ الخمسَ عشرةَ. والإيقافُ:
# حذفُ هذا الملفِّ أو تعطيلُه من واجهةِ Actions متى رُفِعَت الخطّةُ إلى `starter`.
# ميزانيّةُ الساعاتِ: 750 ساعةً لكلِّ Workspace شهريًّا؛ البوّابةُ وحدَها خدمةُ ويبٍ مجانيّةٌ
# (التطبيقُ المصغَّرُ ونسخةُ staging مواقعُ ساكنةٌ) فأقصى استهلاكٍ 744 ساعةً في شهرِ 31 يومًا.
# ولا سِرَّ فيه: `/health` عامٌّ لا يقرأُ قاعدةً.
#
# 2026-10-04: لم يَعُد الشبكةَ الأولى. مراقبُ Supabase (`deploy/watchdog/`، `OPS-ALERT-01`) يفحصُ `/ready`
# كلَّ دقيقةٍ ويُنبِّهُ عبرَ Telegram والبريد، وفحصُه يُبقي البوّابةَ مستيقظةً أيضاً. يبقى هذا شبكةً ثانيةً
# مستقلّةً عن Supabase (جدولةُ GitHub متقطّعة: فواصلُ حتى 4 ساعاتٍ مقيسةٌ في 2026-10-03).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gateway-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: نبضُ /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # الإقلاعُ بعدَ النومِ قد يقاربُ دقيقةً، فالمهلةُ 90 ثانيةً ومحاولاتٌ معدودةٌ. والفشلُ
      # يُسقِطُ الوظيفةَ ظاهرًا ولا يُبتلَع: بوّابةٌ لا تُجيبُ خبرٌ يجبُ أن يُرى.
      - name: نبضُ البوّابة
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/health.body -w '%{http_code}' --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://waslah-gateway.onrender.com/health)"
          echo "/health → ${code}"
          # OPS-ALERT-02: إيقافُ Render (503 «Service Suspended») لا يُوقظُه نبض، ولا يزولُ إلّا بإجراءٍ من
          # المالكِ في لوحةِ Render، ومراقبُ Supabase ينبّهُ عنه كلَّ ساعة. فلا يُسقَطُ النبضُ كلَّ 5 دقائق
          # بإشعارِ فشلٍ مكرَّر؛ يُكتَبُ تحذيرٌ ظاهرٌ في التشغيل.
          if [ "${code}" = "503" ] && grep -qi '<title>[[:space:]]*Service Suspended' /tmp/health.body; then
            echo "::warning::Render أوقف البوابة (Service Suspended). يلزم إجراء من لوحة Render."
            exit 0
          fi
          if [ "${code}" != "200" ]; then
            echo "::error::/health أجابَ ${code} لا 200"
            exit 1
          fi
