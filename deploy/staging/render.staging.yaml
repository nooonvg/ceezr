# ⚠️ ملفٌّ مُولَّدٌ — لا يُحرَّرُ باليدِ (F9-01 · OPS-001 · ADR 0206).
#
# مُشتقٌّ آليّاً من render.yaml بثلاثةِ فروقٍ مُعلَنةٍ لا رابعَ لها:
#   1) اسمُ كلِّ خدمةٍ يُلحَقُ به -staging،
#   2) أصلُ خدمةٍ من المخطّطِ (https://<اسم>.onrender.com) يُلحَقُ به -staging
#      كذلك، فلا تُعيدُ staging كتابةَ /v1/* إلى بوّابةِ الإنتاج (ADR 0250)،
#   3) هذا الرأسُ بدلَ رأسِ الأصلِ.
# وكلُّ ما عداها — الحاويةُ والزمنُ التشغيليُّ ووضعُ القاعدةِ والمتغيّراتُ
# والفحوصُ وسياسةُ النشرِ — مطابقٌ للإنتاجِ حرفاً بحرفٍ، والتعليقاتُ الداخليّةُ
# موروثةٌ من الأصلِ كما هي (أسماءُ الخدماتِ فيها أسماءُ الإنتاجِ).
#
# لإعادةِ التوليدِ بعدَ تعديلِ render.yaml:
#   bun run scripts/check-staging-blueprint.ts --write
# والحاجزُ نفسُه بلا --write يُسقِطُ CI على أيِّ تباعدٍ.
#
# لا يلتقطُه Render تلقائيّاً (ليسَ في الجذرِ)، ويُطبَّقُ بأمرٍ صريحٍ كمخطّطٍ
# مستقلٍّ بقيمِ أسرارٍ مستقلّةٍ — والأسرارُ كلُّها sync: false.
services:
  # ── البوابة: عمليةٌ واحدةٌ تحملُ الويبهوكَ والعاملَ ولوحةَ الإدارةِ (2026-10-02) ──
  #
  # قرارُ المالكِ 2026-10-02: الخطّةُ المجّانيّةُ وحدَها متاحةٌ الآن. وRender لا يُتيحُ
  # `type: worker` مجّاناً أصلاً، وكلُّ خدمةِ ويبٍ مجّانيّةٍ تستهلكُ من 750 ساعةً شهريّةً
  # لمساحةِ العملِ (~744 ساعةً لخدمةٍ دائمةٍ). فخدمتا `waslah-worker` و`waslah-admin`
  # حُذِفَتا من المخطوطةِ — ولم تكونا مُنشأتَينِ في Render قطُّ — والمهامُّ واللوحةُ
  # تعملانِ داخلَ البوّابةِ بالقلبِ الطارئِ الموثَّقِ في ADR 0063/0064. والعودةُ إلى
  # الفصلِ: استرجاعُ الكتلتَينِ من تاريخِ git (قبلَ هذا الالتزامِ) وقلبُ السطرَينِ إلى "false".
  - type: web
    name: waslah-gateway-staging
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.gateway
    region: frankfurt # أقرب منطقة Render إلى السعودية حتى الانتقال إلى البحرين
    # free يطابقُ الواقعَ المنشورَ: تنامُ بعدَ 15 دقيقةً بلا طلبٍ واردٍ، فيلزمُ نبضٌ
    # خارجيٌّ على /health (docs/ops/free-tier-keep-alive.md).
    plan: free
    # /ready لا /health: الأول يسأل القاعدة فعلاً، والثاني يجيب بمجرّد أن العملية
    # حيّة — ونسخة حيّة بلا قاعدة تستقبل تحديثات لتفقدها.
    healthCheckPath: /ready
    # سياسة الإطلاق: المدن الخمس تُفعَّل معاً؛ وعدد نسخ البوابة قرار سعة مستقل عن عدد المدن.
    numInstances: 1
    autoDeploy: false # النشر بأمر لا بكل دفعة إلى main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # مخزن الجلسات — أين تُحفظ حالة الحوار وحدها. لا يدلّ على عدد العمليات (ADR 0051).
      #
      # BUG-016: كانت القيمة `memory` وهي **تمنع الإقلاع رأساً** لا تُضعف ضماناً:
      # `packages/shared/config/index.ts` يردّ `InvalidEnvVarError` على اقتران
      # `NODE_ENV=production` مع `SESSION_STORE=memory` (SCL-002 · BUG-007)،
      # و`apps/gateway/src/index.ts` ينفّذ `process.exit(1)` عند فشل الضبط.
      # وحاجز `check-instance-invariant.ts` يمنع عودة التناقض برمز
      # `SESSION_STORE_MEMORY_IN_PRODUCTION`.
      - key: SESSION_STORE
        value: redis
      # طوبولوجيا التشغيل — «كم عمليةً نحن» (ADR 0051). يكافئ numInstances أعلاه،
      # ورفعه إلى multi-process يُسقط الحاجز ما دامت آلية التوزيع in-process.
      - key: PROCESS_TOPOLOGY
        value: single-process
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # رفعُ وثائقِ السائقِ موقوفٌ حتّى تثبتَ نسخةُ المخزنِ باستعادةٍ فعليّة؛
      # يفتحُه المالكُ بالقيمةِ enabled وحدَها (BACKUP-STORAGE-20261011.md).
      - key: DRIVER_DOCUMENT_UPLOADS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DRIVER_BOT_TOKEN
        sync: false
      - key: RIDER_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_TELEGRAM_ID
        sync: false
      - key: TRANSLATION_PROVIDER
        value: none # قرار المزوّد الإنتاجي مفتوح — ADR 0010
      - key: TRANSLATION_API_KEY
        sync: false
      - key: TRANSLATION_CONTACT_EMAIL
        sync: false
      # ── موضع المهامّ الدورية: خدمة العامل وحدها (F5-04 / SCL-007 · ADR 0063) ──
      #
      # كان هذا السطر "true" لسببٍ مكتوبٍ لا لسهو: خدمة `waslah-worker` أدناه كانت
      # معرَّفة في هذا الملف وغير مُنشأة فعلاً في Render حسب
      # `docs/directive-item-0-live-diagnosis.md` §0.2، ومع "false" لم تُنفَّذ مهمّة
      # دورية واحدة أبداً: لا اشتراك ينتهي، ولا عرض يُسقَط بمهلته فيبقى الطلب باحثاً
      # للأبد، ولا نسخة احتياطية تُؤخَذ. فكان الإدماج ضرراً أقلّ من التوقّف التامّ.
      #
      # وهذا السطر وحده لا يُنشئ خدمة عامل ولا يُثبت أنها تعمل. فما يمنع عودة تلك
      # الفجوة بعد الفصل ثلاثة، لا حسن ظنّ:
      #
      # 1. `scripts/check-instance-invariant.ts` يرفض هذا الملف إن أُعلن "false"
      #    للبوّابة ولم تُوجد خدمة `type: worker` معها — فلا يُمكن التعبير عن حالة
      #    «لا مهامّ في أيّ موضع» في المخطوطة أصلاً (رمز `JOBS_ORPHANED`).
      # 2. `packages/shared/config` يمنع الإقلاع في الإنتاج إن غاب هذا المتغيّر أو
      #    كُتب بما لا يُفهَم — فلا يُفسَّر سكوتٌ في لوحة المنصّة لصالح أحد الطرفين.
      # 3. `apps/gateway/src/job-health.ts` يُسقِط `/ready` بفحصٍ حرجٍ اسمه
      #    `critical_jobs` إذا انقضى إمهال مهمّة حرجة بلا نبضة — فموت خدمة العامل
      #    يظهر من خارج النظام باسم المهمّة الغائبة لا بصمت. وهذا هو الفارق الفعلي
      #    عن الحال المُشخَّصة في §0.2: هناك لم يكن للغياب مُبلِّغ.
      #
      # وتشغيلهما معاً — لو أُعيد هذا إلى "true" مع بقاء خدمة العامل — ليس خطراً:
      # القفل الموزّع (ADR 0009) يجعل إحداهما تتخطّى بحالة `skipped_locked_elsewhere`.
      # فطرفا الخطأ غير متكافئين، والحارسان أعلاه يحرسان الطرف المكلف منهما.
      #
      # 2026-10-02: صارَ "true" — خدمةُ العاملِ محذوفةٌ (الخطّةُ المجّانيّةُ لا تُتيحُ
      # `type: worker`). والحارسُ `JOBS_ORPHANED` لا يُستثارُ لأنَّ المهامَّ ههنا.
      - key: RUN_WORKER_IN_GATEWAY
        value: "true"
      # ── موضع سطح لوحة الإدارة: خدمة waslah-admin وحدها (F5-08 / ARCH-011 · ADR 0064) ──
      #
      # وهذا الحدّ **معكوسُ الخطرِ** عن أخيه أعلاه، فلا يُقرأ على قياسه:
      #
      # خطأُ F5-04 كان صاخباً بالنتيجة: "false" بلا خدمة عامل ⇒ لا مهمّة دورية
      # واحدة تُنفَّذ. أمّا خطأُ هذا السطر فصامتٌ تماماً: لو بقي "true" مع وجود
      # خدمة اللوحة أدناه لما أخفق طلبٌ واحد — تُقلع الخدمتان، ويُجيب /ready
      # أخضرَ، وتُفتَح اللوحة من العنوانَين وتعمل من كليهما. **والعزلُ الذي دُفع
      # ثمنُه لا يكون قائماً**: خريطةُ العمليّات الحيّة وتقاريرُ الحرارة والدفعات
      # تبقى تسحب من بِركة اتّصالات القاعدة نفسِها التي يجب أن تُجيب منها معالجةُ
      # ويبهوك تلغرام في ثوانٍ (ARCH-013: الأولويّات جزءٌ من المعمارية، وبِركةٌ
      # واحدة لا تعرف أولويّة). ولا يُكتشَف ذلك إلا بقياسٍ لا يجريه أحد.
      #
      # فالحاجز `scripts/check-instance-invariant.ts` يرفض **الطرفين معاً**:
      # `ADMIN_DUPLICATED` (هذا truthy وخدمة اللوحة موجودة) و`ADMIN_ORPHANED`
      # (هذا falsy ولا خدمة لوحة — فلا سطحَ إدارةٍ في أيّ موضع). و"true" يبقى
      # قيمةً مشروعةً للتراجع الطارئ: تُحذَف خدمة اللوحة ويُقلَب هذا، فترجع
      # اللوحة إلى البوابة في دفعةٍ واحدة.
      #
      # 2026-10-02: صارَ "true" — هذا هو «التراجعُ الطارئُ» الموصوفُ أعلاه حرفاً:
      # خدمةُ اللوحةِ محذوفةٌ، فاللوحةُ في البوّابةِ، ولا `ADMIN_DUPLICATED` ولا `ADMIN_ORPHANED`.
      - key: RUN_ADMIN_IN_GATEWAY
        value: "true"
      # ── سطحُ البوتِ (ADR 0213) ──────────────────────────────────────
      # miniapp: البوتُ طبقةُ دخولٍ وإشعاراتٍ وأوامرَ أساسيّةٍ، والعملُ في التطبيقِ المصغَّرِ.
      # التراجعُ: `legacy` هنا وفي العاملِ معاً ثمّ إعادةُ النشرِ (docs/rollback.md).
      - key: BOT_SURFACE_MODE
        value: miniapp
      # `sync: false` كعادةِ الملفِّ في العناوينِ الخاصّةِ بكلِّ بيئةٍ: staging المشتقّةُ من هذا الملفِّ
      # تفتحُ تطبيقَها هي لا تطبيقَ الإنتاجِ. وغيابُه مع `miniapp` يُسقِطُ الإقلاعَ صراحةً (ADR 0213).
      - key: MINIAPP_URL
        sync: false
      # ── النسخ الاحتياطي اليومي إلى Google Drive (البند 7) ──────────────
      # كلها sync: false: أسرار لا تُكتب هنا. غيابها يُعطّل المهمّة بصمت لا يوقف الإقلاع.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_BACKUP_FOLDER_ID
        sync: false
      - key: BACKUP_RETENTION_COUNT
        sync: false
      # مجلّد نسخٍ محليّ بديل عن Google Drive حين تتعطّل اعتماداته. أقلّ حمايةً
      # من مخزنٍ خارجيّ لكنّه ليس عدماً، وغيابه يعيد السلوك إلى Drive وحده.
      - key: BACKUP_LOCAL_DIR
        sync: false
      # ── الرصد: سجلّ مقاييس Prometheus على /metrics ──────────────────────
      # يفشل مغلقاً بغياب السرّ (401): مقاييسُ منصّةٍ مفتوحةٌ للعالم تكشف أحجام
      # الأعمال وأوقات الذروة وعدد السائقين لمن طلب الرابط.
      - key: METRICS_TOKEN
        sync: false
      # ── التجميع المركزي للمقاييس (F5-07 / SCL-006 · ADR 0062) ──────────
      # /metrics يعرض العمليةَ التي أجابت لا النظام. فتدفع كلُّ عمليةٍ مقاييسَها
      # إلى مُجمِّعٍ واحدٍ يُقرأ منه المجموع — وهو شرطٌ سابقٌ لرفع numInstances
      # فوق ١ (F5-06) ولفصل العامل عن البوابة (F5-04)، لا تحسينٌ بجانبهما.
      # فارغاً: مُطفأٌ صراحةً والنظامُ يعمل كاملاً بدونه.
      - key: METRICS_EXPORT_ENDPOINT
        sync: false
      # سرٌّ: ترويساتُ اعتمادِ المُجمِّع بصيغة name=value مفصولةً بفواصل.
      # لا تُسجَّل ولا تظهر في رسالة خطأ.
      - key: METRICS_EXPORT_HEADERS
        sync: false
      - key: METRICS_EXPORT_INTERVAL_SECONDS
        value: "15"
      # فارغاً: يُولَّد عند الإقلاع فيُميَّز عن أختِه في المُجمِّع. لا يُضبَط إلا
      # إن أعطت المنصّةُ معرّفاً ثابتاً أفضل منه.
      - key: SERVICE_INSTANCE_ID
        sync: false
      # ── بابُ استقبالِ أحداثِ CORE (البند W-5) ────────────────────────────
      # سرُّ اشتراكِ CORE الصادرِ المُوجَّهِ إلى `/webhook/core-events`. لا يقلّ عن
      # 32 محرفاً، وغيابُه لا يفتح باباً بلا توقيعٍ بل لا يُركِّب المسارَ أصلاً.
      - key: CORE_INBOUND_SIGNING_SECRET
        sync: false
      # ── جلسة التطبيق المصغَّر (البند F1-03) ─────────────────────────────
      # سرُّ توقيعِ الجلسةِ الداخليةِ التي تُصدَر بعد التحقّق من initData. غيابُه
      # يُعطّل مسارَ POST /v1/session/telegram وحدَه (503) ولا يوقف الإقلاع، ولا
      # يُصدَر معه أيُّ رمزٍ بتوقيعٍ افتراضي. لا يقلّ عن 32 محرفاً، ومنفصلٌ عن
      # رمزَي البوت: أحدهما يُثبِت هويةَ تيليجرام والآخر يوقّع تفويضَ نظامِنا.
      - key: MINIAPP_SESSION_SECRET
        sync: false
      # ── SEC-21: الباب الموازي للإدارة (break-glass) ─────────────────────
      # مفتاح AES-256-GCM لتشفير أسرار TOTP في الخادم. لا يُكتب هنا (sync:
      # false)، وغيابُه يُعطِّل التسجيلَ في البابِ وحده لا الإقلاع.
      - key: ADMIN_BREAK_GLASS_TOTP_KEY
        sync: false
      # ── طبقة الدفع: اشتراك السائق الشهري فقط (البند 8) ──────────────────
      # مزوّدا Tap وMoyasar مدمجان فعلاً. كلها sync: false — أسرار لا تُكتب هنا،
      # وغيابها يُعطّل مسار الدفع وحده بصمت لا يوقف الإقلاع.
      #
      # ‏PAYMENT_PROVIDER: tap أو moyasar للدفع الحقيقي، أو manual للتفعيل اليدوي عبر الدعم.
      - key: PAYMENT_PROVIDER
        sync: false
      # مفتاح Tap السرّي (sk_…): Bearer للـAPI ومفتاح HMAC للويبهوك معاً.
      - key: TAP_SECRET_KEY
        sync: false
      # صفحة العودة بعد الدفع — لازمة لمدى و3DS وليست سرّاً.
      - key: TAP_REDIRECT_URL
        sync: false
      # عنوان ويبهوك Tap لهذه الخدمة.
      - key: TAP_POST_URL
        sync: false
      # مفتاح Moyasar السرّي (sk_…) يُستخدم كاسم مستخدم في Basic auth.
      - key: MOYASAR_SECRET_KEY
        sync: false
      # السرّ الذي يُثبِته Moyasar داخل جسم الويبهوك (secret_token). لم يعد
      # ‏PAYMENT_WEBHOOK_SECRET مقروءاً: مقارنةُ سرٍّ في ترويسةٍ مخترعة كانت تجعل
      # معرفةَ السرّ وحدها كافيةً لتفعيل أي اشتراك بأي مبلغ.
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      # صفحة النتيجة التي يُعاد إليها الدافع بعد الدفع (عامّة لا سرّ فيها).
      - key: MOYASAR_CALLBACK_URL
        sync: false
      - key: MOYASAR_SUCCESS_URL
        sync: false
      - key: MOYASAR_BACK_URL
        sync: false
      - key: PAYMENT_ENVIRONMENT
        sync: false
      - key: ENABLE_DRIVER_SUBSCRIPTION
        sync: false
      # ── طبقة الخرائط والتوجيه (البند 9 والمرحلة 15) ──────────────────────
      # ‏OSRM العام مُفعَّلٌ (قرار المالك 2026-10-03): router.project-osrm.org لحساب المسار
      # والمدّة. سياسةُ الخادم العامّ: طلبٌ واحدٌ في الثانية لا أكثر، واستخدامٌ غيرُ تجاريّ
      # (https://github.com/Project-OSRM/osrm-backend/wiki/Demo-server) — فالحدُّ 1/1.
      # للإطلاق التجاريّ: OSRM ذاتيُّ الاستضافة على خريطة الجزيرة العربية ورفعُ الحدّ.
      - key: ROUTING_PROVIDER
        value: osrm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      # ‏REQ-09 / ADR 0190: حدُّ عقدِ حسابِ التوجيهِ <طلبات>/<ثوانٍ> — مطلوبٌ في الإنتاجِ
      # متى كانَ ROUTING_PROVIDER غيرَ none، وإلّا مُنِعَ الإقلاعُ.
      - key: ROUTING_RATE_LIMIT
        value: "1/1"
      - key: MAP_STYLE_URL
        sync: false
      - key: MAP_PROVIDER
        sync: false
      - key: MAP_TILES_PUBLIC_KEY
        sync: false
      # ── طبقة التتبّع اللحظي (البند 9) ──────────────────────────────────────
      # كلّها اختياريّة: الغياب يعني افتراض المجال في packages/domain/geo/gps-fix.ts.
      # وكانت هذه الكتلة تحمل أسماءً لا وجود لها في .env.example ولا في الكود
      # (IDLE_INTERVAL بلا GPS_، MAX_SPEED بلا REASONABLE_) فمن ضبطها هنا ضبط
      # أسماءً لا يقرؤها أحد. الأسماء الآن موحَّدةٌ ومقروءةٌ، و scripts/check-env-drift.ts
      # يُسقط البناء إن عاد الانحراف.
      - key: TRACKING_GPS_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_GPS_IDLE_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_MIN_DISTANCE_METERS
        sync: false
      - key: TRACKING_TELEPORT_THRESHOLD_METERS
        sync: false
      - key: TRACKING_MAX_REASONABLE_SPEED_KMH
        sync: false
      - key: TRACKING_MAX_ACCURACY_METERS
        sync: false
      - key: TRACKING_MAX_TIME_DRIFT_SECONDS
        sync: false
      # ‏TRACKING_TOKEN_BASE_URL: أساسُ روابط التتبّع المُشارَكة (§4.2). غيابُه
      # يُطفئ ميزةَ الرابط صريحاً بلا كسر أيّ شيء آخر، ووجودُه يُلزم https في
      # الإنتاج. لا يُشتقّ من ترويسة الطلب أبداً — التفصيل في packages/shared/config.
      - key: TRACKING_TOKEN_BASE_URL
        sync: false
      # ── ناقلُ أحداثِ MOVE إلى CORE (البند W-5) — انتقلَ من خدمةِ اللوحةِ المحذوفةِ ──
      - key: CORE_EVENTS_BASE_URL
        sync: false
      - key: CORE_EVENTS_BEARER_TOKEN
        sync: false

  # ── التطبيقُ المصغَّرُ: موقعٌ ساكنٌ يُفتَحُ من داخلِ تلغرام وحدَه ─────────────
  #
  # `F1-10` · `TG-005` · ADR 0165 · DEC-07.
  #
  # ولماذا خدمةٌ مستقلّةٌ ولم تُخدَم الملفّاتُ من البوّابةِ؟ لأنَّ `F1-10` يُلزِمُ
  # **أصلاً واحداً** للتطبيقِ، والبوّابةُ سطحُ ويبهوكٍ لتلغرام: خدمتُها للملفّاتِ
  # تخلطُ سطحَ هجومٍ عامّاً بسطحٍ يستقبلُ توقيعَ البوتِ. والموقعُ الساكنُ في
  # Render مجّانيٌّ ولا يُشغِّلُ عمليّةً، فلا يُكلِّفُ خطّةً ولا يزيدُ اتّصالاً
  # بقاعدةٍ ولا مستهلِكاً لمجرى Redis.
  #
  # **ولا `numInstances` ولا `PROCESS_TOPOLOGY` ههنا — وغيابُهما مقصودٌ محروسٌ**:
  # لا عمليّةَ تُقلِعُ فلا شيءَ يقرأُ المتغيّرَ، وكتابتُه لإرضاءِ حاجزٍ وصفٌ كاذبٌ
  # يقرأُه من يأتي بعدَنا حقّاً. والحاجزُ `scripts/check-instance-invariant.ts`
  # يعرفُ `runtime: static` ويُسقِطُ البناءَ إن كُتِبَ أحدُهما ههنا.
  - type: web
    runtime: static
    name: waslah-miniapp-staging
    # bun مثبَّتٌ على نفسِ إصدارِ صورِ Docker (1.4.2) لا على وسمٍ عائمٍ: بناءٌ
    # بإصدارٍ آخرَ ليس البناءَ الذي فحصَه CI. و`--frozen-lockfile` لأنَّ حلَّ
    # الاعتمادياتِ من جديدٍ يجعلُ الأخضرَ شهادةً على شيءٍ آخرَ.
    # زيادةٌ 2026-09-28 (`DEC-20` · `ح-8`): كانَ الأمرُ يبدأُ بـ`npm install -g bun@1.4.2`
    # فأسقطَ أوّلَ بناءٍ حقيقيٍّ على Render (`ENOENT: mkdir '/usr/lib/node_modules/bun'`
    # — لا صلاحيةَ كتابةٍ على المسارِ العامِّ). وRender يحملُ bun أصلاً ويُثبِّتُه
    # بالمتغيّرِ `BUN_VERSION` (https://render.com/docs/bun-version)، فالتثبيتُ صارَ
    # هناكَ والقصدُ نفسُه: الإصدارُ الذي فحصَه CI لا وسمٌ عائمٌ.
    buildCommand: bun install --frozen-lockfile && bun run build:miniapp
    staticPublishPath: apps/miniapp/dist
    autoDeploy: false # النشرُ بأمرٍ لا بكلِّ دفعةٍ إلى main — كأخواتِها
    # تحذيرٌ لا يُحذَفُ: تغييرُ هذا الرابطِ يُبطِلُ الرابطَ المسجَّلَ في BotFather
    # فيفتحُ الراكبُ تطبيقاً غيرَ موجودٍ. ولا يُغيَّرُ إلّا بخطّةِ ترحيلٍ مكتوبةٍ.
    routes:
      # ── إعادةُ كتابةِ البوّابةِ من أصلِ التطبيقِ (PRD-004 · ADR 0250) ─────────────
      #
      # الحزمةُ تطلبُ مساراتٍ نسبيّةً (`VITE_WASLAH_API_BASE` فارغ = نفسُ الأصل)،
      # فهذه القواعدُ الثلاثُ هي مسارُ الشبكةِ الذي يعملُ به التطبيقُ فعلًا. كانت
      # في لوحةِ Render وحدَها (DEC-20 §4.2)، ومزامنةُ Blueprint كانت ستمحوها فيسقطُ
      # كلُّ نداء. قِيسَت حيّةً قبلَ كتابتِها (2026-10-09): `/v1/me` 401 JSON،
      # `/socket.io/?EIO=4&transport=polling` 200، `/health` 200 — والقيمُ هنا مطابقة.
      # **الترتيبُ ملزِم**: قبلَ احتياطِ `/*` وإلّا ابتلعَها `index.html`.
      # والاشتقاقُ الآليُّ لـstaging يُلحِقُ `-staging` بالأصلِ نفسِه، فلا تصلُ
      # staging بوّابةَ الإنتاج (`scripts/lib/staging-blueprint.ts`).
      - type: rewrite
        source: /v1/*
        destination: https://waslah-gateway-staging.onrender.com/v1/*
      - type: rewrite
        source: /socket.io/*
        destination: https://waslah-gateway-staging.onrender.com/socket.io/*
      - type: rewrite
        source: /health
        destination: https://waslah-gateway-staging.onrender.com/health
      # احتياطُ تطبيقِ الصفحةِ الواحدةِ: كلُّ مسارٍ غيرِ موجودٍ يُعادُ كتابتُه إلى
      # `index.html` فيتولّى التوجيهَ في المتصفحِ. ولو غابَ هذا لأعطى Render 404
      # لكلِّ مسارٍ داخليٍّ يُفتَحُ مباشرةً.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # ── مَن يُسمَحُ له بتأطيرِ التطبيقِ — أخطرُ رأسٍ ههنا ────────────────────
      #
      # التطبيقُ المصغَّرُ **يعملُ داخلَ إطارٍ في تلغرام**، فسياسةُ التأطيرِ شرطُ
      # عملٍ لا تشديدٌ أمنيٌّ زائدٌ. و`frame-ancestors` **لا يُمكِنُ بثُّها في
      # وسمِ `<meta>` ألبتّةَ** — رأسُ استجابةٍ فقط، ولذلكَ موضعُها ههنا وحدَه.
      #
      # ولا يُكتَبُ `X-Frame-Options` ههنا أبداً: قيمتاه `DENY` و`SAMEORIGIN`
      # كلتاهما تمنعانِ تأطيرَ تلغرام، فيرى المستخدمُ **شاشةً بيضاءَ** في
      # Telegram Desktop وWeb بلا رسالةِ خطأٍ — عطلٌ صامتٌ يبدو «التطبيقُ لا يعمل».
      # والرأسُ ليس مُكمِّلاً لـ`frame-ancestors` بل مناقضٌ له ههنا.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors https://telegram.org https://*.telegram.org
      # بقيّةُ توجيهاتِ CSP (default-src · script-src · connect-src …) تبقى في
      # وسمِ `apps/miniapp/index.html` **ولا تُكرَّرُ ههنا**: مصدرانِ لحقيقةٍ
      # واحدةٍ يفترقانِ بسهوٍ، والوسمُ محروسٌ حرفاً بحرفٍ في
      # `scripts/check-single-origin-assets.ts`. فالتقسيمُ بالقدرةِ لا بالتفضيلِ:
      # ما يعملُ في الوسمِ يبقى فيه، وما لا يعملُ إلّا رأساً يُكتَبُ ههنا.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # الموقعُ لا يُفعِّلُ كاميرا ولا ميكروفوناً ولا مدفوعاتِ متصفحٍ ولا USB.
      # **ولا يُقيَّدُ `geolocation` ههنا**: تحديدُ موضعِ الراكبِ جوهرُ التطبيقِ،
      # وتقييدُه يُسقِطُ طلبَ الرحلةِ نفسَه لا يُشدِّدُ أمناً.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), payment=(), usb=()
      # سنةٌ بلا `includeSubDomains` ولا `preload`: النطاقُ الحاليُّ نطاقٌ فرعيٌّ
      # مشتركٌ على `onrender.com`، وإعلانُ شمولِ النطاقاتِ الفرعيّةِ من موقعٍ
      # ساكنٍ يتعدّى على نطاقٍ لا نملكُه.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # أصولُ البناءِ مبصومةٌ بمحتواها (Vite)، فاسمُ الملفِّ يتغيّرُ بتغيُّرِ
      # محتواه ويصحُّ تخزينُها إلى الأبدِ.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # و`index.html` **لا يُخزَّنُ**: هو الذي يُحيلُ إلى الأصولِ المبصومةِ، فنسخةٌ
      # قديمةٌ منه في مخزنٍ تُحيلُ إلى أصولٍ حُذِفَت — تطبيقٌ أبيضُ بعدَ كلِّ نشرٍ.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # زيادةٌ 2026-10-07 (`UI-10` · ADR 0245): قاعدةُ رؤوسِ Render تُطابِقُ **مسارَ الطلبِ**
      # لا هدفَ إعادةِ الكتابةِ، وتيليجرام يفتحُ `/` (كلُّ روابطِ الدخولِ = الأصلُ + استعلامٌ،
      # `packages/shared/miniapp-link`). فقِيسَ حيّاً: `/index.html` = `no-cache` و`/` =
      # `public, max-age=0, s-maxage=300` — أي نسخةٌ قديمةٌ على الحافّةِ حتى خمسِ دقائقَ بعدَ
      # النشرِ تُحيلُ إلى أصولٍ مبصومةٍ حُذِفَت (404) = شاشةٌ بيضاء. فالجذرُ يُعلَنُ صراحةً.
      - path: /
        name: Cache-Control
        value: no-cache
    envVars:
      - key: BUN_VERSION
        value: "1.4.2"
      # عنوانُ البوّابةِ العامُّ. `sync: false` كعادةِ الملفِّ، **ولسببٍ آخرَ
      # ههنا**: القيمةُ ليست سرّاً (تُخبَزُ في حزمةٍ عامّةٍ ويقرأُها كلُّ متصفحٍ)،
      # بل هي **غيرُ معلومةٍ في المستودعِ**: عنوانُ الخدمةِ يُصدِرُه Render عندَ
      # أوّلِ نشرٍ. وكتابةُ عنوانٍ مُخترَعٍ ههنا تُنتِجُ `connect-src` يُحاصِرُ
      # التطبيقَ عن خادمِه — فتُدخَلُ مرّةً في اللوحةِ بعدَ معرفةِ العنوانِ.
      # وفراغُها يعني «نفسُ الأصلِ» (apps/miniapp/src/api/client.ts).
      - key: VITE_WASLAH_API_BASE
        sync: false
      # رابطُ العودةِ إلى البوتِ لشاشةِ «خارجَ تيليجرام». ليسَ سرّاً — يُخبَزُ في
      # حزمةٍ عامّةٍ — لكنَّه **غيرُ معلومٍ في المستودعِ**: اسمُ البوتِ يُقرأُ في
      # الخادمِ من `getMe`. وغيابُه لا يُعطِّلُ شيئاً: لا يُعرَضُ زرٌّ، والشاشةُ
      # تبقى سليمةً بنصِّها (`apps/miniapp/src/system/bot-link.ts`).
      - key: VITE_WASLAH_BOT_LINK
        sync: false
